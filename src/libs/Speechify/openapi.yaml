KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"201":{"description":"The created knowledge base.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:KnowledgeBase"}}}}},"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:CreateKnowledgeBaseRequest"}}}}}},"/v1/knowledge-bases/{id}":{"get":{"operationId":"get","summary":"Get","description":"Retrieve a knowledge base by ID.","tags":["subpackage_tts.subpackage_tts/knowledgeBases"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The requested knowledge base.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:KnowledgeBase"}}}}}},"delete":{"operationId":"delete","summary":"Delete","description":"Soft-delete a knowledge base. Documents and chunks are cascaded.","tags":["subpackage_tts.subpackage_tts/knowledgeBases"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Successful response"}}},"patch":{"operationId":"update","summary":"Update","description":"Update a knowledge base.","tags":["subpackage_tts.subpackage_tts/knowledgeBases"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The updated knowledge base.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:KnowledgeBase"}}}}},"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:UpdateKnowledgeBaseRequest"}}}}}},"/v1/knowledge-bases/{id}/documents":{"get":{"operationId":"list-documents","summary":"List Documents","description":"List documents ingested into a knowledge base.","tags":["subpackage_tts.subpackage_tts/knowledgeBases"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The documents in the knowledge base.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:ListKnowledgeBaseDocumentsResponse"}}}}}},"post":{"operationId":"upload-document","summary":"Upload Document","description":"Upload a document (PDF, plain text, markdown, or HTML) to a\nknowledge base. The document is extracted, chunked, embedded, and\nindexed synchronously; expect a few seconds per MB of input.\nMaximum 10 MB per upload.","tags":["subpackage_tts.subpackage_tts/knowledgeBases"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"201":{"description":"The ingested document record.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:KnowledgeBaseDocument"}}}}},"requestBody":{"content":{"multipart/form-data":{"schema":{"type":"object","properties":{"file":{"type":"string","format":"binary"}},"required":["file"]}}}}}},"/v1/knowledge-bases/documents/{docId}":{"get":{"operationId":"get-document","summary":"Get Document","description":"Retrieve a document by ID.","tags":["subpackage_tts.subpackage_tts/knowledgeBases"],"parameters":[{"name":"docId","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The document record.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:KnowledgeBaseDocument"}}}}}},"delete":{"operationId":"delete-document","summary":"Delete Document","description":"Delete a document and all its chunks.","tags":["subpackage_tts.subpackage_tts/knowledgeBases"],"parameters":[{"name":"docId","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Successful response"}}}},"/v1/knowledge-bases/documents/{docId}/chunks":{"get":{"operationId":"list-chunks","summary":"List Chunks","description":"List the chunks for a document.","tags":["subpackage_tts.subpackage_tts/knowledgeBases"],"parameters":[{"name":"docId","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The chunks for the document.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:ListKnowledgeBaseChunksResponse"}}}}}}},"/v1/knowledge-bases/search":{"post":{"operationId":"search","summary":"Search","description":"Semantic search across a caller-owned list of knowledge bases.\nReturns ranked chunks with source filename and a cosine-similarity\nscore. Limited to 50 results per request.","tags":["subpackage_tts.subpackage_tts/knowledgeBases"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Ranked search hits across the selected knowledge bases.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:SearchKnowledgeBasesResponse"}}}}},"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:SearchKnowledgeBasesRequest"}}}}}},"/v1/memories/{memoryId}":{"delete":{"operationId":"delete","summary":"Delete","description":"Soft-delete one memory row.","tags":["subpackage_tts.subpackage_tts/memories"],"parameters":[{"name":"memoryId","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Successful response"}}}},"/v1/phone-numbers":{"get":{"operationId":"list","summary":"List","description":"List all phone numbers in the caller's workspace.","tags":["subpackage_tts.subpackage_tts/phoneNumbers"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The phone numbers for the workspace.","content":{"application/json":{"schema":{"description":"Any type"}}}}}},"post":{"operationId":"import","summary":"Import","description":"Import a phone number into the workspace. The `source` field\ndetermines the provisioning path:\n\n- `livekit` - LiveKit purchases the number on your behalf. US\n  inbound only. Quickest path for local testing.\n- `twilio` - Provide your Twilio Account SID, Auth Token, and\n  the E.164 number you already own. We provision an Elastic SIP\n  Trunk on your Twilio account automatically.\n- `byoc` - Provide an existing SIP trunk ID. The number is\n  registered against that trunk.\n\nReturns 402 when the workspace has reached the 100-number cap.\n","tags":["subpackage_tts.subpackage_tts/phoneNumbers"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"201":{"description":"The imported phone number.","content":{"application/json":{"schema":{"description":"Any type"}}}}},"requestBody":{"content":{"application/json":{"schema":{"description":"Any type"}}}}}},"/v1/phone-numbers/{id}":{"get":{"operationId":"get","summary":"Get","description":"Retrieve a phone number by ID.","tags":["subpackage_tts.subpackage_tts/phoneNumbers"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The requested phone number.","content":{"application/json":{"schema":{"description":"Any type"}}}}}},"delete":{"operationId":"delete","summary":"Delete","description":"Delete a phone number from the workspace. For Twilio and LiveKit\nnumbers this also deprovisions the backing SIP trunk and dispatch\nrule on LiveKit Cloud.\n","tags":["subpackage_tts.subpackage_tts/phoneNumbers"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Successful response"}}},"patch":{"operationId":"update","summary":"Update","description":"Update a phone number. Only `label` and `agent_id` are mutable;\n`source` and `e164` are immutable after import. Pass `null` for\n`agent_id` to unbind the number from its current agent.\n","tags":["subpackage_tts.subpackage_tts/phoneNumbers"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The updated phone number.","content":{"application/json":{"schema":{"description":"Any type"}}}}},"requestBody":{"content":{"application/json":{"schema":{"description":"Any type"}}}}}},"/v1/sip-trunks":{"get":{"operationId":"list","summary":"List","description":"List all SIP trunks in the caller's workspace.","tags":["subpackage_tts.subpackage_tts/sipTrunks"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The SIP trunks for the workspace.","content":{"application/json":{"schema":{"description":"Any type"}}}}}},"post":{"operationId":"create","summary":"Create","description":"Create a SIP trunk. For `kind=byoc` supply `sip_address` plus\noptional digest credentials and IP allowlist. For `kind=twilio`\nuse `ImportPhoneNumber` with a `twilio` spec instead - trunk\ncreation is handled automatically. Returns 402 when the workspace\nhas reached the 20-trunk cap.\n","tags":["subpackage_tts.subpackage_tts/sipTrunks"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"201":{"description":"The created SIP trunk.","content":{"application/json":{"schema":{"description":"Any type"}}}}},"requestBody":{"content":{"application/json":{"schema":{"description":"Any type"}}}}}},"/v1/sip-trunks/{id}":{"get":{"operationId":"get","summary":"Get","description":"Retrieve a SIP trunk by ID.","tags":["subpackage_tts.subpackage_tts/sipTrunks"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The requested SIP trunk.","content":{"application/json":{"schema":{"description":"Any type"}}}}}},"delete":{"operationId":"delete","summary":"Delete","description":"Delete a SIP trunk. This also removes the backing LiveKit inbound\ntrunk, outbound trunk, and dispatch rule if they were provisioned\nby us. Phone numbers attached to this trunk are left in place but\nbecome non-functional until rebound to a new trunk.\n","tags":["subpackage_tts.subpackage_tts/sipTrunks"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Successful response"}}}},"/v1/outbound-calls":{"post":{"operationId":"create","summary":"Create","description":"Place an outbound call from an agent to a phone number. LiveKit\noriginates the SIP INVITE through the outbound trunk bound to the\nagent's workspace; the agent worker is dispatched into the room\nautomatically.\n\nThe response is returned as soon as LiveKit accepts the INVITE.\nPoll `GET /v1/conversations/{conversation_id}` for status\ntransitions: `pending` → `active` (answered) → `completed`.\n\nRequires a Twilio or BYOC trunk. LiveKit-native numbers are\ninbound-only.\n","tags":["subpackage_tts.subpackage_tts/outboundCalls"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"201":{"description":"The outbound call was accepted by LiveKit.","content":{"application/json":{"schema":{"description":"Any type"}}}}},"requestBody":{"content":{"application/json":{"schema":{"description":"Any type"}}}}}},"/v1/tenants":{"get":{"operationId":"list","summary":"List","description":"List every workspace the authenticated user belongs to. Powers the workspace switcher.","tags":["subpackage_tts.subpackage_tts/workspaces"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Workspaces for the authenticated user.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:TenantsListResponse"}}}}}},"post":{"operationId":"create","summary":"Create","description":"Create a new workspace with the authenticated user as owner.\nThe caller must switch their active workspace client-side via\nthe `X-Tenant-ID` header to act on the new tenant.\n","tags":["subpackage_tts.subpackage_tts/workspaces"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"201":{"description":"The newly-created workspace.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:Tenant"}}}}},"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:CreateWorkspaceRequest"}}}}}},"/v1/tenants/current":{"get":{"operationId":"get-current","summary":"Get Current","description":"Retrieve the workspace currently selected by the caller (via `X-Tenant-ID` or auto-resolved).","tags":["subpackage_tts.subpackage_tts/workspaces"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The current workspace.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:Tenant"}}}}}},"patch":{"operationId":"update-current","summary":"Update Current","description":"Rename the current workspace. Owner or admin only.","tags":["subpackage_tts.subpackage_tts/workspaces"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The updated workspace.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:Tenant"}}}}},"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:UpdateWorkspaceRequest"}}}}}},"/v1/tenants/current/members":{"get":{"operationId":"list-members","summary":"List Members","description":"List every member of the current workspace. Any member may call this.","tags":["subpackage_tts.subpackage_tts/workspaces"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Members of the current workspace.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:MembersListResponse"}}}}}}},"/v1/tenants/current/members/leave":{"post":{"operationId":"leave","summary":"Leave","description":"Remove the authenticated caller from the current workspace.\nRefused with 409 when the caller is the last owner — promote\nanother member to owner first.\n","tags":["subpackage_tts.subpackage_tts/workspaces"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Successful response"}}}},"/v1/tenants/current/members/{user_uid}":{"delete":{"operationId":"remove-member","summary":"Remove Member","description":"Remove a member from the current workspace. Owner or admin\nonly. The caller cannot remove themselves — use\n`POST /v1/tenants/current/members/leave` instead.\n","tags":["subpackage_tts.subpackage_tts/workspaces"],"parameters":[{"name":"user_uid","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Successful response"}}},"patch":{"operationId":"update-member-role","summary":"Update Member Role","description":"Change a member's role. Owner only — admins may add or remove\nmembers but may not change roles. Refused with 409 when\ndemoting the last remaining owner.\n","tags":["subpackage_tts.subpackage_tts/workspaces"],"parameters":[{"name":"user_uid","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The updated member.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:Member"}}}}},"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:UpdateMemberRoleRequest"}}}}}},"/v1/tenants/current/invites":{"get":{"operationId":"list-invites","summary":"List Invites","description":"List outstanding invites for the current workspace. Invite tokens are redacted.","tags":["subpackage_tts.subpackage_tts/workspaces"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Outstanding invites.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:InvitesListResponse"}}}}}},"post":{"operationId":"create-invite","summary":"Create Invite","description":"Create an invite to the current workspace. Owner or admin only.\nThe response contains the invite token ONCE — subsequent list\ncalls redact it.\n","tags":["subpackage_tts.subpackage_tts/workspaces"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"201":{"description":"The created invite (token included).","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:Invite"}}}}},"requestBody":{"content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:CreateInviteRequest"}}}}}},"/v1/tenants/current/invites/{id}":{"delete":{"operationId":"revoke-invite","summary":"Revoke Invite","description":"Revoke an outstanding invite. Owner or admin only. Idempotent.","tags":["subpackage_tts.subpackage_tts/workspaces"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"Successful response"}}}},"/v1/invites/{token}/accept":{"post":{"operationId":"accept-invite","summary":"Accept Invite","description":"Accept a workspace invite. The authenticated caller is joined\nto the invite's workspace as a member. Expired, revoked, or\nalready-accepted tokens return 404 to avoid token enumeration.\n","tags":["subpackage_tts.subpackage_tts/workspaces"],"parameters":[{"name":"token","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The workspace the caller just joined.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:Tenant"}}}}}}},"/v1/invites/{token}":{"get":{"operationId":"preview-invite","summary":"Preview Invite","description":"Preview a workspace invite without 