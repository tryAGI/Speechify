rt sessions.\n"},"allowed_origins":{"type":"array","items":{"type":"string"},"description":"Exact `Origin` header values (e.g. `https://example.com`)\nthat are allowed to start public sessions. Empty array\nwith `is_public = true` means any origin is accepted —\nintended for open demos. No subdomain wildcards.\n"},"hostname_allowlist":{"type":["array","null"],"items":{"type":"string"},"description":"Optional per-agent hostname allowlist enforced at\nsession-creation time. When set and non-empty, the\n`Origin` header's hostname must be an exact member.\nBare hostnames only — no scheme, port, or path. Up to\n10 entries. Omit (null) or leave empty for no\nenforcement (public agents accept any hostname).\n"},"memory_enabled":{"type":"boolean","description":"When true, the post-call extractor writes durable facts about\neach caller; at conversation-start the retriever injects the\ntop matches into the system prompt via the `{{memory}}`\ntemplate variable. Defaults to false.\n"},"memory_retention_days":{"type":"integer","description":"Maximum age (in days) of memories kept and surfaced to the\nretriever. 0 disables the cap. Defaults to 90.\n"},"created_at":{"type":"string","format":"date-time"},"updated_at":{"type":"string","format":"date-time"}},"required":["id","name","slug","language","llm_model","voice_id","temperature","is_public","allowed_origins","memory_enabled","memory_retention_days","created_at","updated_at"],"title":"Agent"},"tts:ListAgentsResponse":{"type":"object","properties":{"agents":{"type":"array","items":{"$ref":"#/components/schemas/tts:Agent"}}},"required":["agents"],"title":"ListAgentsResponse"},"tts:CreateAgentRequest":{"type":"object","properties":{"name":{"type":"string"},"slug":{"type":"string","description":"Optional; auto-generated from name if omitted."},"prompt":{"type":"string"},"first_message":{"type":"string","description":"Spoken verbatim at session start — no LLM round trip."},"language":{"type":"string","default":"en"},"llm_model":{"type":"string","description":"Optional chat model slug. Leave empty to use the Speechify default."},"voice_id":{"type":"string","description":"Voice slug from the VMS catalog (see GET /v1/voices). Required — the server rejects writes with an unknown or empty slug."},"temperature":{"type":"number","format":"double"},"config":{"type":"object","additionalProperties":{"description":"Any type"}},"is_public":{"type":"boolean","default":false},"allowed_origins":{"type":"array","items":{"type":"string"}},"hostname_allowlist":{"type":"array","items":{"type":"string"},"description":"Optional per-agent hostname allowlist (see Agent schema)."},"memory_enabled":{"type":"boolean","default":false},"memory_retention_days":{"type":"integer","default":90}},"required":["name","voice_id"],"title":"CreateAgentRequest"},"tts:UpdateAgentRequest":{"type":"object","properties":{"name":{"type":"string"},"prompt":{"type":"string"},"first_message":{"type":"string"},"language":{"type":"string"},"llm_model":{"type":"string"},"voice_id":{"type":"string"},"temperature":{"type":"number","format":"double"},"config":{"type":"object","additionalProperties":{"description":"Any type"}},"is_public":{"type":"boolean"},"allowed_origins":{"type":"array","items":{"type":"string"}},"hostname_allowlist":{"type":"array","items":{"type":"string"},"description":"When supplied, replaces the stored list. Pass an empty\narray to clear enforcement (public agent is open again).\nOmit the field to leave the existing value unchanged.\n"},"memory_enabled":{"type":"boolean"},"memory_retention_days":{"type":"integer"}},"title":"UpdateAgentRequest"},"tts:ToolKind":{"type":"string","enum":["system","webhook","client"],"description":"Where the tool executes.\n- `system`:  worker-resident built-in (e.g. end_call, transfer_to_number)\n- `webhook`: worker signs a payload and POSTs it to your URL\n- `client`:  worker dispatches to the caller's browser/SDK via data channel\n","title":"ToolKind"},"tts:SystemToolConfigBuiltin":{"type":"string","enum":["end_call","transfer_to_number","transfer_to_agent","play_keypad_touch_tone","skip_turn"],"title":"SystemToolConfigBuiltin"},"tts:ToolParamType":{"type":"string","enum":["string","number","integer","boolean"],"title":"ToolParamType"},"tts:ToolParam":{"type":"object","properties":{"name":{"type":"string"},"type":{"$ref":"#/components/schemas/tts:ToolParamType"},"description":{"type":"string"},"required":{"type":"boolean"},"enum":{"type":"array","items":{"type":"string"}}},"required":["name","type","description","required"],"description":"One argument the LLM can pass when calling the tool. Mirrors the JSON-Schema subset standard function-calling schemas support.","title":"ToolParam"},"tts:SystemToolConfig":{"type":"object","properties":{"builtin":{"$ref":"#/components/schemas/tts:SystemToolConfigBuiltin"},"params":{"type":"array","items":{"$ref":"#/components/schemas/tts:ToolParam"}},"builtin_config":{"type":"object","additionalProperties":{"description":"Any type"},"description":"Per-builtin extras (e.g. allowed_numbers for transfer_to_number)."}},"required":["builtin"],"description":"Config shape for `kind=system`.","title":"SystemToolConfig"},"tts:WebhookToolConfigMethod":{"type":"string","enum":["POST","GET"],"default":"POST","title":"WebhookToolConfigMethod"},"tts:WebhookToolConfig":{"type":"object","properties":{"url":{"type":"string","format":"uri"},"method":{"$ref":"#/components/schemas/tts:WebhookToolConfigMethod"},"headers":{"type":"object","additionalProperties":{"type":"string"},"description":"Static headers sent with every call. `Authorization` and `X-Speechify-Signature` are reserved."},"timeout_ms":{"type":"integer","default":10000,"description":"Per-call timeout in milliseconds."},"params":{"type":"array","items":{"$ref":"#/components/schemas/tts:ToolParam"}}},"required":["url"],"description":"Config shape for `kind=webhook`.","title":"WebhookToolConfig"},"tts:ClientToolConfig":{"type":"object","properties":{"params":{"type":"array","items":{"$ref":"#/components/schemas/tts:ToolParam"}},"timeout_ms":{"type":"integer","default":10000}},"description":"Config shape for `kind=client`. Execution happens in the caller's browser / SDK.","title":"ClientToolConfig"},"tts:ToolConfig":{"oneOf":[{"$ref":"#/components/schemas/tts:SystemToolConfig"},{"$ref":"#/components/schemas/tts:WebhookToolConfig"},{"$ref":"#/components/schemas/tts:ClientToolConfig"}],"description":"One of `SystemToolConfig`, `WebhookToolConfig`, or `ClientToolConfig` depending on `kind`.","title":"ToolConfig"},"tts:Tool":{"type":"object","properties":{"id":{"type":"string"},"name":{"type":"string"},"description":{"type":"string"},"kind":{"$ref":"#/components/schemas/tts:ToolKind"},"config":{"$ref":"#/components/schemas/tts:ToolConfig","description":"One of `SystemToolConfig`, `WebhookToolConfig`, or `ClientToolConfig` depending on `kind`."},"webhook_secret":{"type":"string","description":"HMAC signing secret for `kind=webhook`. Returned in full **only** on the create\nresponse; all subsequent reads return a masked placeholder. Store it on first\ncreate — there is no way to retrieve it later.\n"},"created_at":{"type":"string","format":"date-time"},"updated_at":{"type":"string","format":"date-time"}},"required":["id","name","description","kind","config","created_at","updated_at"],"title":"Tool"},"tts:ListToolsResponse":{"type":"object","properties":{"tools":{"type":"array","items":{"$ref":"#/components/schemas/tts:Tool"}}},"required":["tools"],"title":"ListToolsResponse"},"tts:EvaluationCriterion":{"type":"object","properties":{"id":{"type":"string"},"name":{"type":"string"},"description":{"type":"string"}},"required":["id","name","description"],"description":"One LLM-scored assertion about the call (\"Did the agent confirm the customer's name?\").","title":"EvaluationCriterion"},"tts:DataCollectionFieldType":{"type":"string","enum":["string","int","number","boolean"],"title":"DataCollectionFieldType"},"tts:DataCollectionField":{"type":"object","properties":{"key":{"type":"string"},"description":{"type":"string"},"type":{"$ref":"#/components/schemas/tts:DataCollectionFieldType"}},"required":["key","description","type"],"description":"A structured value the post-call evaluator should extract from the\ntranscript. `int` is distinct from `number` so downstream consumers\nreceive whole integers without a synthetic decimal.\n","title":"DataCollectionField"},"tts:EvaluationConfig":{"type":"object","properties":{"criteria":{"type":"array","items":{"$ref":"#/components/schemas/tts:EvaluationCriterion"}},"data_collection":{"type":"array","items":{"$ref":"#/components/schemas/tts:DataCollectionField"}}},"required":["criteria","data_collection"],"title":"EvaluationConfig"},"tts:UpdateEvaluationConfigRequest":{"type":"object","properties":{"criteria":{"type":"array","items":{"$ref":"#/components/schemas/tts:EvaluationCriterion"}},"data_collection":{"type":"array","items":{"$ref":"#/components/schemas/tts:DataCollectionField"}}},"required":["criteria","data_collection"],"title":"UpdateEvaluationConfigRequest"},"tts:DynamicVariableType":{"type":"string","enum":["string","number","boolean","json"],"description":"Declared type of a customer-scope variable. Enforced at save time\nand again at session-start when an override value is supplied.\n- `string`  - plain text value; interpolated verbatim with `{{name}}`\n- `number`  - numeric value; rendered as its decimal representation\n- `boolean` - `true` or `false`\n- `json`    - any valid JSON value; use `{{name|json}}` to inject\n              safely inside JSON tool bodies\n","title":"DynamicVariableType"},"tts:DynamicVariable":{"type":"object","properties":{"key":{"type":"string","description":"Variable name. Must match `[a-zA-Z0-9_]+`. The `system__` prefix\nis reserved for platform-populated variables and will be rejected.\n"},"type":{"$ref":"#/components/schemas/tts:DynamicVariableType"},"default":{"description":"Optional default value used when no per-session override is\nsupplied. Must conform to the declared `type`.\n"},"description":{"type":"string","description":"Human-readable note shown in the console variable editor."}},"required":["key","type"],"description":"One customer-scope variable definition on an agent. Referenced in\nprompts, first messages, and webhook tool configs via `{{key}}` or\n`{{key|json}}`. Missing variables render as empty string at dispatch\ntime - a typo never breaks a session.\n","title":"DynamicVariable"},"tts:SystemVariableDoc":{"type":"object","properties":{"key":{"type":"string","description":"The reserved variable key (always starts with `system__`)."},"description":{"type":"string","description":"What the variable contains and when it is populated."}},"required":["key","description"],"description":"Documents one reserved `system__*` variable that the platform\nauto-populates at session start. Customers cannot define or\noverride these keys.\n","title":"SystemVariableDoc"},"tts:ListDynamicVariablesResponse":{"type":"object","properties":{"variables":{"type":"array","items":{"$ref":"#/components/schemas/tts:DynamicVariable"},"description":"Customer-defined variables for this agent."},"system_variables":{"type":"array","items":{"$ref":"#/components/schemas/tts:SystemVariableDoc"},"description":"Platform-populated `system__*` variables, provided for\nreference. This list is the same for every agent.\n"}},"required":["variables","system_variables"],"description":"Response for `GET /v1/agents/{id}/variables`. Returns both the\ncustomer-scope variable catalogue and the read-only `system__*`\ncatalogue so the editor UI has a single source of truth.\n","title":"ListDynamicVariablesResponse"},"tts:UpdateDynamicVariablesRequest":{"type":"object","properties":{"variables":{"type":"array","items":{"$ref":"#/components/schemas/tts:DynamicVariable"},"description":"The new variable list. Replaces the existing list entirely."}},"required":["variables"],"description":"PATCH body for `PATCH /v1/agents/{id}/variables`. Replaces the\nstored variable list wholesale. Pass an empty array to clear all\nvariables. Up to 20 variables per agent.\n","title":"UpdateDynamicVariablesRequest"},"tts:CreateConversationRequest":{"type":"object","properties":{"transport":{"type":["string","null"],"description":"Transport hint. Omit to use the agent's default."},"dynamic_variables":{"type":"object","additionalProperties":{"description":"Any type"},"description":"Per-session variable overrides that merge on top of the agent's\nstored variable defaults for this one conversation. Keys in the\nreserved `system__` namespace are rejected. Values must match the\ndeclared type of the corresponding variable definition on the agent.\n"}},"description":"Optional body for `POST /v1/agents/{id}/conversations`.","title":"CreateConversationRequest"},"tts:ConversationStatus":{"type":"string","enum":["pending","active","completed","failed"],"title":"ConversationStatus"},"tts:ConversationTransport":{"type":"string","enum":["web","sip"],"title":"ConversationTransport"},"tts:Conversation":{"type":"object","properties":{"id":{"type":"string"},"agent_id":{"type":"string"},"room_name":{"type":"string"},"room_sid":{"type":"string"},"status":{"$ref":"#/components/schemas/tts:ConversationStatus"},"transport":{"$ref":"#/components/schemas/tts:ConversationTransport"},"started_at":{"type":["string","null"],"format":"date-time","description":"Set when the first user participant joins the realtime\nvoice session. Null between CreateConversation and the\nparticipant-joined event, and stays null if no user ever\njoins.\n"},"ended_at":{"type":["string","null"],"format":"date-time"},"duration_ms":{"type":["integer","null"]},"cost_cents":{"type":["integer","null"]},"recording_url":{"type":["string","null"]},"metadata":{"type":"object","additionalProperties":{"description":"Any type"}}},"required":["id","agent_id","room_name","status","transport"],"title":"Conversation"},"tts:CreateConversationResponse":{"type":"object","properties":{"conversation":{"$ref":"#/components/schemas/tts:Conversation"},"room":{"type":"string"},"token":{"type":"string","description":"Short-lived realtime session access token (JWT)."},"url":{"type":"string","description":"Realtime session wss:// URL to connect to."}},"required":["conversation","room","token","url"],"description":"Returned when a conversation is created. The `token` + `url`\nlet the caller connect its browser/SDK directly to the\nrealtime voice session — the agent that answers is dispatched\nserver-side.\n","title":"CreateConversationResponse"},"tts:CreateSessionRequest":{"type":"object","properties":{"user_identity":{"type":"string","description":"Opaque identifier for the end-user (e.g. your app's user ID). Stamped onto the conversation. Optional - defaults to an anonymous per-session ID."},"dynamic_variables":{"type":"object","additionalProperties":{"description":"Any type"},"description":"Per-session variable overrides that merge on top of the agent's\nstored variable defaults for this one session. Keys in the\nreserved `system__` namespace are rejected at this boundary.\nValues must match the declared type of the corresponding variable\ndefinition on the agent (a `string` type expects a JSON string,\n`number` expects a JSON number, etc.).\n"}},"description":"Optional body for `POST /v1/agents/{id}/sessions`. Widget embeds usually pass nothing.","title":"CreateSessionRequest"},"tts:KnowledgeBase":{"type":"object","properties":{"id":{"type":"string"},"name":{"type":"string","description":"Human-readable label, shown in the console."},"description":{"type":"string","description":"Optional description."},"document_count":{"type":"integer","description":"Number of ingested documents."},"created_at":{"type":"string","format":"date-time"},"updated_at":{"type":"string","format":"date-time"}},"required":["id","name","description","document_count","created_at","updated_at"],"description":"A bundle of documents that can be attached to one or more voice\nagents. Chunks across every document in the knowledge base are\nembedded and searched together.","title":"KnowledgeBase"},"tts:ListKnowledgeBasesResponse":{"type":"object","properties":{"knowledge_bases":{"type":"array","items":{"$ref":"#/components/schemas/tts:KnowledgeBase"}}},"required":["knowledge_bases"],"title":"ListKnowledgeBasesResponse"},"tts:Memory":{"type":"object","properties":{"id":{"type":"string"},"agent_id":{"type":"string"},"caller_identity":{"type":"string","description":"Stable caller key (LiveKit participant identity) the memory is scoped to."},"fact":{"type":"string","description":"Short third-person statement about the caller."},"source_conversation_id":{"type":"string","description":"Conversation the memory was extracted from (may be empty if the source was deleted)."},"confidence":{"type":"number","format":"double","description":"LLM self-reported 0-1 confidence in the fact's durability and relevance."},"score":{"type":"number","format":"double","description":"Populated only on retrieval hits — recency-weighted cosine similarity."},"created_at":{"type":"string","format":"date-time"}},"required":["id","agent_id","caller_identity","fact","confidence","created_at"],"description":"One salient fact extracted post-call about a specific caller on\na specific agent. Retrieved at the next conversation-start for\nthe same caller and injected into the agent's system prompt via\nthe `{{memory}}` template variable.","title":"Memory"},"tts:ListMemoriesResponse":{"type":"object","properties":{"memories":{"type":"array","items":{"$ref":"#/components/schemas/tts:Memory"}}},"required":["memories"],"title":"ListMemoriesResponse"},"tts:DeleteMemoriesByCallerRequest":{"type":"object","properties":{"agent_id":{"type":"string"},"caller_identity":{"type":"string"}},"required":["agent_id","caller_identity"],"title":"DeleteMemoriesByCallerRequest"},"tts:DeleteMemoriesByCallerResponse":{"type":"object","properties":{"deleted":{"type":"integer","description":"Number of memories soft-deleted."}},"required":["deleted"],"title":"DeleteMemoriesByCallerResponse"},"tts:TestType":{"type":"string","enum":["scenario","tool","simulation"],"description":"Discriminates the shape of `AgentTest.config`.\n- `scenario` - send one message to the agent and judge the response with an LLM.\n- `tool` - assert that the agent calls a specific tool given a context.\n- `simulation` - run a multi-turn conversation between the agent and an AI caller.\n","title":"TestType"},"tts:SimulationMessageRole":{"type":"string","enum":["user","assistant"],"title":"SimulationMessageRole"},"tts:SimulationMessage":{"type":"object","properties":{"role":{"$ref":"#/components/schemas/tts:SimulationMessageRole"},"content":{"type":"string"}},"required":["role","content"],"description":"One turn in a simulation conversation. `role` is `user` (the AI caller) or `assistant` (the agent).","title":"SimulationMessage"},"tts:ScenarioConfig":{"type":"object","properties":{"context":{"type":"string","description":"User message sent to the agent to trigger the behaviour under test. Optional when `initial_chat_history` already ends with a user message."},"success_criteria":{"type":"string","description":"Natural-language description of what a passing agent response looks like."},"success_examples":{"type":"array","items":{"type":"string"},"description":"Concrete examples of passing responses (few-shot for the judge)."},"failure_examples":{"type":"array","items":{"type":"string"},"description":"Concrete examples of failing responses (few-shot for the judge)."},"initial_chat_history":{"type":"array","items":{"$ref":"#/components/schemas/tts:SimulationMessage"},"description":"Optional seed conversation prepended before `context`. Lets you test the agent's reply mid-conversation rather than on a cold single-turn prompt."},"system_prompt_override":{"type":"string","description":"Replaces the agent's system prompt for this run only. Useful for regression-isolating prompt changes."},"first_message_override":{"type":"string","description":"Replaces the agent's first message for this run only."},"model_override":{"type":"string","description":"Overrides the LLM model used by the agent for this run only."}},"required":["success_criteria"],"description":"Configuration for a `scenario` test. The runner sends `context` as\na user message and asks an LLM judge to evaluate the agent response\nagainst `success_criteria`. Optional few-shot examples sharpen the\njudge's calibration. Use `initial_chat_history` to prepend prior\nturns before `context`; when the history already ends with a user\nmessage, `context` may be omitted and the agent is evaluated on\nits reply to that last history turn.","title":"ScenarioConfig"},"tts:ParameterCheckMode":{"type":"string","enum":["exact","regex","llm"],"description":"How a `ParameterCheck` validates a tool argument.\n- `exact` - JSON equality.\n- `regex` - the argument stringified is matched against the pattern.\n- `llm` - an LLM judge decides whether the value semantically satisfies\n  the criteria (e.g. \"is a plausible email address\").\n","title":"ParameterCheckMode"},"tts:ParameterCheck":{"type":"object","properties":{"path":{"type":"string","description":"Dotted JSON path to the argument being checked. Empty means the whole args object."},"mode":{"$ref":"#/components/schemas/tts:ParameterCheckMode"},"expected":{"type":"string","description":"Expected value string for `exact` and `regex` modes."},"criteria":{"type":"string","description":"Natural-language criteria for `llm` mode (e.g. \"is a valid email address\")."}},"required":["path","mode"],"description":"Validates one argument of an expected tool call. `path` is a\ndotted JSON path (e.g. `customer.email`); use zero-indexed\nnotation for arrays (`items.0.sku`). An empty path checks the\nwhole args object.","title":"ParameterCheck"},"tts:ToolCallConfig":{"type":"object","properties":{"context":{"type":"string","description":"User message that should cause the agent to invoke the expected tool. Optional when `initial_chat_history` already ends with a user message."},"expected_tool":{"type":"string","description":"Name of the tool the agent is expected to call."},"parameter_checks":{"type":"array","items":{"$ref":"#/components/schemas/tts:ParameterCheck"},"description":"Assertions on specific arguments of the tool call."},"initial_chat_history":{"type":"array","items":{"$ref":"#/components/schemas/tts:SimulationMessage"},"description":"Optional seed conversation prepended before `context`."},"system_prompt_override":{"type":"string","description":"Replaces the agent's system prompt for this run only."},"model_override":{"type":"string","description":"Overrides the LLM model used by the agent for this run only."}},"required":["expected_tool"],"description":"Configuration for a `tool` test. The runner sends `context` as a\nuser message and asserts that the agent calls `expected_tool` with\narguments matching all `parameter_checks`. Use\n`initial_chat_history` to test tool invocations that only make\nsense mid-conversation.","title":"ToolCallConfig"},"tts:SimulationConfig":{"type":"object","properties":{"scenario":{"type":"string","description":"Instructions for the AI caller describing who they are and what they want."},"success_condition":{"type":"string","description":"Natural-language description of what a passing conversation looks like."},"max_turns":{"type":"integer","default":5,"description":"Maximum agent turns before the simulation is cut off and judged."},"initial_chat_history":{"type":"array","items":{"$ref":"#/components/schemas/tts:SimulationMessage"},"description":"Optional seed conversation that precedes the AI caller's first generated message."},"system_prompt_override":{"type":"string","description":"Replaces the agent's system prompt for this run only."},"model_override":{"type":"string","description":"Overrides the LLM model used by the agent for this run only."}},"required":["scenario","success_condition","max_turns"],"description":"Configuration for a `simulation` test. An AI caller drives a\nmulti-turn conversation with the agent according to `scenario`.\nAfter `max_turns` exchanges (or when the agent ends the call), an\nLLM judge evaluates whether `success_condition` was met.\nUse `initial_chat_history` to seed the conversation at a specific\nmid-flow state.","title":"SimulationConfig"},"tts:AgentTestConfig":{"oneOf":[{"$ref":"#/components/schemas/tts:ScenarioConfig"},{"$ref":"#/components/schemas/tts:ToolCallConfig"},{"$ref":"#/components/schemas/tts:SimulationConfig"}],"description":"Type-specific configuration document.","title":"AgentTestConfig"},"tts:MockingStrategy":{"type":"string","enum":["none","all","selected"],"description":"Controls which tool calls the runner intercepts during a run.\nSystem tools (`end_call`, `transfer_to_number`, etc.) are never\nmocked regardless of strategy.\n- `none` - no interception; all tools are called normally.\n- `all` - every non-system tool call is intercepted and matched\n  against the `mocks` list.\n- `selected` - only tools explicitly listed in `mocks` are\n  intercepted; others are called normally.\n","title":"MockingStrategy"},"tts:ToolMock":{"type":"object","properties":{"tool_name":{"type":"string","description":"Name of the tool to intercept."},"args_match":{"type":"string","description":"Optional substring of the JSON-serialised call arguments. When\nabsent the mock matches unconditionally for this tool."},"response":{"description":"JSON value returned to the agent as the tool result."}},"required":["tool_name","response"],"description":"A canned response returned when the agent calls `tool_name`. If\n`args_match` is set the mock only triggers when its value appears\nas a substring of the JSON-serialised call arguments (a deliberately\nsimple v1 matcher — full expression support is planned). A mock\nwithout `args_match` always matches for its tool.","title":"ToolMock"},"tts:NoMatchBehavior":{"type":"string","enum":["call_real_tool","finish_with_error","skip"],"description":"Fallback when a mockable tool is called but no configured mock\nmatches the call arguments.\n- `call_real_tool` - pass-through: actually invoke the underlying tool.\n- `finish_with_error` - fail: short-circuit the run to an `error`\n  status. Useful when a test wants to assert that a specific mocked\n  response path is taken - any unmocked tool call aborts the run.\n- `skip` - return an empty stub (`{\"skipped\":true}`) to the agent so\n  the simulation proceeds without treating the call as a failure.\n  Useful when a tool's output is irrelevant to the behaviour under\n  test but the model may still decide to call it.\n","title":"NoMatchBehavior"},"tts:ToolMockConfig":{"type":"object","properties":{"strategy":{"$ref":"#/components/schemas/tts:MockingStrategy"},"mocks":{"type":"array","items":{"$ref":"#/components/schemas/tts:ToolMock"},"description":"Canned responses for specific tools (order matters - first match wins)."},"no_match_behavior":{"$ref":"#/components/schemas/tts:NoMatchBehavior"}},"required":["strategy","no_match_behavior"],"description":"Controls tool-call interception during a test run.","title":"ToolMockConfig"},"tts:TestRunStatus":{"type":"string","enum":["queued","running","passed","failed","error"],"description":"Lifecycle of a test run: `queued` - `running` - terminal.\n\nTerminal states:\n- `passed` - the agent behaviour met the success criteria.\n- `failed` - the agent behaviour did not meet the success criteria.\n- `error` - the runner itself could not complete (LLM outage, network error, etc.),\n  distinct from `failed` which means the agent behaviour was judged and found lacking.\n","title":"TestRunStatus"},"tts:ScenarioResult":{"type":"object","properties":{"agent_response":{"type":"string","description":"The raw text response the agent produced."},"passed":{"type":"boolean"},"rationale":{"type":"string","description":"LLM judge's explanation of the verdict."},"score":{"type":"nu