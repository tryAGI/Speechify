value; rendered as its decimal representation\n- `boolean` - `true` or `false`\n- `json`    - any valid JSON value; use `{{name|json}}` to inject\n              safely inside JSON tool bodies\n","title":"DynamicVariableType"},"DynamicVariable":{"type":"object","properties":{"key":{"type":"string","description":"Variable name. Must match `[a-zA-Z0-9_]+`. The `system__` prefix\nis reserved for platform-populated variables and will be rejected.\n"},"type":{"$ref":"#/components/schemas/DynamicVariableType"},"default":{"description":"Optional default value used when no per-session override is\nsupplied. Must conform to the declared `type`.\n"},"description":{"type":"string","description":"Human-readable note describing the variable."}},"required":["key","type"],"description":"One customer-scope variable definition on an agent. Referenced in\nprompts, first messages, and webhook tool configs via `{{key}}` or\n`{{key|json}}`. Missing variables render as empty string at dispatch\ntime - a typo never breaks a session.\n","title":"DynamicVariable"},"SystemVariableDoc":{"type":"object","properties":{"key":{"type":"string","description":"The reserved variable key (always starts with `system__`)."},"description":{"type":"string","description":"What the variable contains and when it is populated."}},"required":["key","description"],"description":"Documents one reserved `system__*` variable that the platform\nauto-populates at session start. Customers cannot define or\noverride these keys.\n","title":"SystemVariableDoc"},"ListDynamicVariablesResponse":{"type":"object","properties":{"variables":{"type":"array","items":{"$ref":"#/components/schemas/DynamicVariable"},"description":"Customer-defined variables for this agent."},"system_variables":{"type":"array","items":{"$ref":"#/components/schemas/SystemVariableDoc"},"description":"Platform-populated `system__*` variables, provided for\nreference. This list is the same for every agent.\n"}},"required":["variables","system_variables"],"description":"Response for `GET /v1/agents/{agent_id}/variables`. Returns both the\ncustomer-scope variable catalogue and the read-only `system__*`\ncatalogue so a single source of truth is available client-side.\n","title":"ListDynamicVariablesResponse"},"UpdateDynamicVariablesRequest":{"type":"object","properties":{"variables":{"type":"array","items":{"$ref":"#/components/schemas/DynamicVariable"},"description":"The new variable list. Replaces the existing list entirely."}},"required":["variables"],"description":"PATCH body for `PATCH /v1/agents/{agent_id}/variables`. Replaces the\nstored variable list wholesale. Pass an empty array to clear all\nvariables. Up to 20 variables per agent.\n","title":"UpdateDynamicVariablesRequest"},"CreateConversationRequest":{"type":"object","properties":{"transport":{"type":["string","null"],"description":"Transport hint. Omit to use the agent's default."},"dynamic_variables":{"type":"object","additionalProperties":{"description":"Any type"},"description":"Per-session variable overrides that merge on top of the agent's\nstored variable defaults for this one conversation. Keys in the\nreserved `system__` namespace are rejected. Values must match the\ndeclared type of the corresponding variable definition on the agent.\n"}},"description":"Optional body for `POST /v1/agents/{agent_id}/conversations`.","title":"CreateConversationRequest"},"ConversationStatus":{"type":"string","enum":["pending","active","completed","failed"],"title":"ConversationStatus"},"ConversationTransport":{"type":"string","enum":["web","phone","whatsapp","sip_inbound","sip_outbound"],"description":"How the caller reached the agent. `web` is the browser /\nSDK realtime path; the `sip_*` and `phone` variants come\nfrom the telephony stack.\n","title":"ConversationTransport"},"ConversationEndReason":{"type":"string","enum":["voicemail_message_left","voicemail_hangup","ivr_hangup","unavailable_hangup","agent_ended","caller_hangup","inactivity_timeout","loop_detected","max_duration_reached","over_capacity","dial_no_answer","dial_busy","dial_rejected","dial_failed"],"description":"Coarse termination category. Most reasons are assigned by the\nagent runtime as the call ends; `caller_hangup` may also be\napplied server-side as a post-call catch-all. The `dial_*`\nreasons are assigned server-side on a `failed` conversation\nfor an outbound call that never connected.\n* `voicemail_message_left` \u2014 AMD machine-vm + we spoke the configured drop-message.\n* `voicemail_hangup` \u2014 AMD machine-vm + we terminated silently (action=hangup or empty-message bypass).\n* `ivr_hangup` \u2014 AMD machine-ivr + action=hangup.\n* `unavailable_hangup` \u2014 AMD machine-unavailable (mailbox full / disconnected).\n* `agent_ended` \u2014 LLM-driven end_call builtin.\n* `inactivity_timeout` \u2014 the call ended after the configured silence window elapsed with no activity.\n* `loop_detected` \u2014 a loop guard force-ended the call after several consecutive near-identical user turns (typically an IVR replaying its menu while the agent kept reacting instead of ending the call).\n* `max_duration_reached` - the max-call-duration limit force-ended the call at the platform ceiling (a safety bound on runaway calls).\n* `over_capacity` \u2014 inbound call refused because the workspace was over its active-call concurrency cap; the busy message played and the call hung up. Stamped server-side and excluded from billing.\n* `caller_hangup` \u2014 the caller's leg went away. Stamped immediately when a SIP disconnect is observed; otherwise applied server-side shortly after the call ends as a catch-all (web tab close, network blip, etc.).\n* `dial_no_answer` \u2014 outbound dial: callee did not pick up (SIP 408/480/487, the ringing timeout expired).\n* `dial_busy` \u2014 outbound dial: the line was busy (SIP 486/600).\n* `dial_rejected` \u2014 outbound dial: the call was actively refused (SIP 401/403/407 carrier auth/permission, or 603/607/608 callee decline).\n* `dial_failed` \u2014 outbound dial: any other failure to connect (invalid number, carrier 5xx, malformed trunk address, TLS requirement, transport error). On a `failed` conversation with NULL `duration_ms`.\n* `null` \u2014 the termination category was not recorded. Legacy calls only; current calls always carry a reason.\n","title":"ConversationEndReason"},"AgentSnapshotBackgroundNoisePreset":{"type":"string","enum":["office","city","forest","crowded_room","keyboard_typing","hold_music"],"description":"Ambient-bed preset at call time; null = no background noise.","title":"AgentSnapshotBackgroundNoisePreset"},"AgentSnapshot":{"type":"object","properties":{"schema_version":{"type":"integer"},"captured_at":{"type":"string","format":"date-time"},"name":{"type":"string"},"prompt":{"type":"string"},"first_message":{"type":"string"},"language":{"type":"string"},"llm_provider":{"type":"string","description":"Resolved provider that actually ran (a \"Platform default\"\nagent freezes the concrete platform pair at call time).\n"},"llm_model":{"type":"string"},"llm_base_url":{"type":["string","null"],"description":"Custom-provider endpoint base URL; null for managed providers. The bearer key is never captured."},"llm_extra_body":{"type":["object","null"],"additionalProperties":{"description":"Any type"},"description":"Extra chat.completions body forwarded verbatim for custom-provider agents; null otherwise."},"voice_id":{"type":"string"},"temperature":{"type":"string","title":"float"},"memory_enabled":{"type":"boolean"},"memory_retention_days":{"type":"integer"},"tts_playback_rate":{"type":["string","null"],"title":"float","description":"Post-process time-stretch at call time; null = no time-stretch (1x)."},"response_delay_seconds":{"type":["string","null"],"title":"float","description":"Silence-wait override at call time; null = stack default endpointing."},"stt_override":{"type":["string","null"],"description":"Streaming-STT stack the call dispatched with; null = the worker's platform default."},"amd":{"$ref":"#/components/schemas/AMDConfig"},"save_audio_recording":{"type":"boolean"},"navigator_mode":{"type":"boolean"},"ivr_memory_enabled":{"type":"boolean"},"inactivity_timeout_seconds":{"type":["integer","null"],"description":"Silence-tolerance override at call time; null = platform default."},"background_noise_preset":{"$ref":"#/components/schemas/AgentSnapshotBackgroundNoisePreset","description":"Ambient-bed preset at call time; null = no background noise."},"background_noise_volume":{"type":["string","null"],"title":"float"}},"description":"Frozen copy of the agent's behavioral configuration captured at\nconversation-create time so the detail view can\nrender historical calls accurately even after the live agent\nhas been edited. Carries its own `schema_version` because the\nsnapshot shape evolves independently of the live Agent shape.\n\nField-presence contract: new snapshots emit every field\n(explicit null when unset). A key that is ABSENT from a stored\nsnapshot means the snapshot pre-dates that field's capture;\nreaders hide the value instead of guessing a default.\n","title":"AgentSnapshot"},"ConversationIvrSurrenderReason":{"type":"string","enum":["no_goal","no_cached_menu","below_threshold","fingerprint_mismatch","goal_ambiguous","child_cache_miss","dtmf_send_failure","matched_option_missing_dtmf","disabled","repeated_prompt_max_retries"],"description":"Canonical code the worker emits when the IVR\nnavigator gave up. NULL when the navigator completed\ncleanly OR never started a plan.\n* `no_goal` - the goal extractor returned empty.\n* `no_cached_menu` - AMD-time cache miss for the root fingerprint.\n* `below_threshold` - cached menu loaded but confidence < threshold.\n* `fingerprint_mismatch` - in-call prompt diverged from the cached menu fingerprint.\n* `goal_ambiguous` - cached options matched the goal more than once or not at all.\n* `child_cache_miss` - sub-menu fingerprint had no cached row.\n* `dtmf_send_failure` - DTMF press could not be delivered.\n* `matched_option_missing_dtmf` - defensive shape guard.\n* `disabled` - per-agent toggle off OR operator kill switch on.\n* `repeated_prompt_max_retries` - bounded press-retry on the same fingerprint hit its cap of 1.\n","title":"ConversationIvrSurrenderReason"},"Conversation":{"type":"object","properties":{"id":{"type":"string","description":"Prefixed wire identifier (`conv_<26 char Crockford base32>`).\nURL paths accept only this\nprefixed form; legacy UUID path parameters are rejected with\n404.\n"},"agent_id":{"type":"string","description":"Prefixed wire identifier (`agent_<26 char Crockford base32>`)\nfor the agent that answers this conversation.\n"},"status":{"$ref":"#/components/schemas/ConversationStatus"},"transport":{"$ref":"#/components/schemas/ConversationTransport"},"created_at":{"type":"string","format":"date-time","description":"When the conversation row was created (the call was\ninitiated). Always present, including for conversations\nthat never started \u2014 unlike `started_at` \u2014 so it is the\ntimestamp to display and sort pending calls by.\n"},"started_at":{"type":["string","null"],"format":"date-time","description":"Set when the first user participant joins the realtime\nvoice session. Null between CreateConversation and the\nparticipant-joined event, and stays null if no user ever\njoins.\n"},"ended_at":{"type":["string","null"],"format":"date-time"},"duration_ms":{"type":["integer","null"]},"cost_cents":{"type":["integer","null"]},"recording_url":{"type":["string","null"]},"recording_started_at":{"type":["string","null"],"format":"date-time","description":"When the recording file actually began capturing audio\n(LiveKit egress file started_at). Anchor transcript message\noffsets on this \u2014 not `started_at` \u2014 when seeking the\nrecording: the file's first frame trails the participant\njoin by the egress recorder's spin-up (~1-2s). Null when\nthere is no recording or the row pre-dates the field.\n"},"end_reason":{"$ref":"#/components/schemas/ConversationEndReason","description":"Coarse termination category. Most reasons are assigned by the\nagent runtime as the call ends; `caller_hangup` may also be\napplied server-side as a post-call catch-all. The `dial_*`\nreasons are assigned server-side on a `failed` conversation\nfor an outbound call that never connected.\n* `voicemail_message_left` \u2014 AMD machine-vm + we spoke the configured drop-message.\n* `voicemail_hangup` \u2014 AMD machine-vm + we terminated silently (action=hangup or empty-message bypass).\n* `ivr_hangup` \u2014 AMD machine-ivr + action=hangup.\n* `unavailable_hangup` \u2014 AMD machine-unavailable (mailbox full / disconnected).\n* `agent_ended` \u2014 LLM-driven end_call builtin.\n* `inactivity_timeout` \u2014 the call ended after the configured silence window elapsed with no activity.\n* `loop_detected` \u2014 a loop guard force-ended the call after several consecutive near-identical user turns (typically an IVR replaying its menu while the agent kept reacting instead of ending the call).\n* `max_duration_reached` - the max-call-duration limit force-ended the call at the platform ceiling (a safety bound on runaway calls).\n* `over_capacity` \u2014 inbound call refused because the workspace was over its active-call concurrency cap; the busy message played and the call hung up. Stamped server-side and excluded from billing.\n* `caller_hangup` \u2014 the caller's leg went away. Stamped immediately when a SIP disconnect is observed; otherwise applied server-side shortly after the call ends as a catch-all (web tab close, network blip, etc.).\n* `dial_no_answer` \u2014 outbound dial: callee did not pick up (SIP 408/480/487, the ringing timeout expired).\n* `dial_busy` \u2014 outbound dial: the line was busy (SIP 486/600).\n* `dial_rejected` \u2014 outbound dial: the call was actively refused (SIP 401/403/407 carrier auth/permission, or 603/607/608 callee decline).\n* `dial_failed` \u2014 outbound dial: any other failure to connect (invalid number, carrier 5xx, malformed trunk address, TLS requirement, transport error). On a `failed` conversation with NULL `duration_ms`.\n* `null` \u2014 the termination category was not recorded. Legacy calls only; current calls always carry a reason.\n"},"metadata":{"type":"object","additionalProperties":{"description":"Any type"}},"caller_identity":{"type":"string","description":"Stable caller key (LiveKit participant identity) persisted\nat session start so the post-call memory extractor can\npivot memories by `(agent_id, caller_identity)`. Empty\nstring for anonymous widget sessions.\n"},"from_number":{"type":["string","null"],"description":"E.164 of the phone number that placed the call. For\n`sip_outbound` this is the workspace number used as the\ncaller ID; for `sip_inbound` it is the external caller's\nnumber. Null for `web` conversations and for older\noutbound rows, where the dialing caller id was not recorded\nbefore this field existed.\n"},"to_number":{"type":["string","null"],"description":"E.164 of the phone number that received the call. For\n`sip_outbound` this is the external callee; for\n`sip_inbound` it is the workspace number the caller\ndialed. Null for `web` conversations and for legacy\ninbound rows whose room name did not embed the dialed\nnumber.\n"},"agent_snapshot":{"$ref":"#/components/schemas/AgentSnapshot","description":"Frozen snapshot of the agent's configuration at create\ntime. Populated only on detail responses; list responses\nintentionally skip the column to keep the row small.\n"},"dynamic_variables":{"type":"object","additionalProperties":{"description":"Any type"},"description":"Customer-facing dynamic variables this call ran with: the\nagent's stored variable defaults overlaid with the\nper-session `dynamic_variables` overrides, resolved to\ntheir values. Reserved `system__*` keys are excluded \u2014\nthey are runtime-derived and not part of the audit\nsnapshot. Omitted for SIP inbound calls (which take no\nper-session variables) and for legacy conversations\nrecorded before this field existed. Populated only on\ndetail responses; the\nlist endpoint skips it, mirroring `agent_snapshot`.\n"},"message_count":{"type":"integer","description":"Populated only on the list endpoint via a correlated\nsubquery. Zero on single-row reads where the join cost\nisn't paid.\n"},"ivr_menu_id":{"type":["string","null"],"description":"Audit pointer at the cached IVR menu the\nnavigator consulted on this call. NULL when the navigator\nnever engaged OR after the referenced menu was\ninvalidated (FK is ON DELETE SET NULL).\n"},"ivr_path_taken":{"type":["array","null"],"items":{"type":"object","additionalProperties":{"description":"Any type"}},"description":"Ordered log of the navigator's per-call presses:\n`[{fingerprint, dtmf, label}, ...]`. Empty array means\n\"navigator engaged but pressed nothing\" (distinct from\nNULL = \"navigator never engaged\").\n"},"ivr_surrender_reason":{"$ref":"#/components/schemas/ConversationIvrSurrenderReason","description":"Canonical code the worker emits when the IVR\nnavigator gave up. NULL when the navigator completed\ncleanly OR never started a plan.\n* `no_goal` - the goal extractor returned empty.\n* `no_cached_menu` - AMD-time cache miss for the root fingerprint.\n* `below_threshold` - cached menu loaded but confidence < threshold.\n* `fingerprint_mismatch` - in-call prompt diverged from the cached menu fingerprint.\n* `goal_ambiguous` - cached options matched the goal more than once or not at all.\n* `child_cache_miss` - sub-menu fingerprint had no cached row.\n* `dtmf_send_failure` - DTMF press could not be delivered.\n* `matched_option_missing_dtmf` - defensive shape guard.\n* `disabled` - per-agent toggle off OR operator kill switch on.\n* `repeated_prompt_max_retries` - bounded press-retry on the same fingerprint hit its cap of 1.\n"}},"required":["id","agent_id","status","transport","created_at","metadata","message_count"],"title":"Conversation"},"CreateConversationResponse":{"type":"object","properties":{"conversation":{"$ref":"#/components/schemas/Conversation"},"token":{"type":"string","description":"Short-lived realtime session access token (JWT)."},"url":{"type":"string","description":"Realtime session wss:// URL to connect to."}},"required":["conversation","token","url"],"description":"Returned when a conversation is created. The `token` + `url`\nlet the caller connect its browser/SDK directly to the\nrealtime voice session \u2014 the agent that answers is dispatched\nserver-side.\n","title":"CreateConversationResponse"},"CreateSessionRequest":{"type":"object","properties":{"user_identity":{"type":"string","description":"Opaque identifier for the end-user (e.g. your app's user ID). Stamped onto the conversation. Optional - defaults to an anonymous per-session ID."},"dynamic_variables":{"type":"object","additionalProperties":{"description":"Any type"},"description":"Per-session variable overrides that merge on top of the agent's\nstored variable defaults for this one session. Keys in the\nreserved `system__` namespace are rejected at this boundary.\nValues must match the declared type of the corresponding variable\ndefinition on the agent (a `string` type expects a JSON string,\n`number` expects a JSON number, etc.).\n"}},"description":"Optional body for `POST /v1/agents/{agent_id}/sessions`. Widget embeds usually pass nothing.","title":"CreateSessionRequest"},"ListConversationsResponse":{"type":"object","properties":{"next_cursor":{"type":["string","null"],"description":"Opaque keyset cursor for the next page. Pass back as the\n`cursor` request parameter. `null` when the caller has\nreached the end of the list (`has_more` is also `false`\nin that case).\n"},"has_more":{"type":"boolean","description":"True when more rows exist beyond this page."},"conversations":{"type":"array","items":{"$ref":"#/components/schemas/Conversation"}}},"required":["next_cursor","has_more","conversations"],"description":"Shared pagination metadata composed into every cursor-paginated\nlist response via `allOf`. Ships `has_more` alongside `next_cursor`\nas two equivalent end-of-pages signals (defense-in-depth).\n","title":"ListConversationsResponse"},"RecentCallee":{"type":"object","properties":{"phone":{"type":"string","description":"E.164 phone number that was dialled."},"last_called_at":{"type":"string","format":"date-time","description":"Timestamp of the most recent outbound call to this number."}},"required":["phone","last_called_at"],"description":"One distinct phone number this workspace has dialled, with the timestamp of the most recent outbound call to it.","title":"RecentCallee"},"ListRecentCalleesResponse":{"type":"object","properties":{"next_cursor":{"type":["string","null"],"description":"Opaque keyset cursor for the next page. Pass back as the\n`cursor` request parameter. `null` when the caller has\nreached the end of the list (`has_more` is also `false`\nin that case).\n"},"has_more":{"type":"boolean","description":"True when more rows exist beyond this page."},"callees":{"type":"array","items":{"$ref":"#/components/schemas/RecentCallee"}}},"required":["next_cursor","has_more","callees"],"description":"Payload for GET /v1/agents/conversations/recent-callees.","title":"ListRecentCalleesResponse"},"ConversationStats":{"type":"object","properties":{"total":{"type":"integer","format":"int64"},"completed":{"type":"integer","format":"int64"},"failed":{"type":"integer","format":"int64"},"active":{"type":"integer","format":"int64"},"pending":{"type":"integer","format":"int64"},"avg_duration_ms":{"type":["number","null"],"format":"double"},"avg_cost_cents":{"type":["number","null"],"format":"double"}},"required":["total","completed","failed","active","pending","avg_duration_ms","avg_cost_cents"],"description":"Counts + averages over the caller's conversations matching the supplied filters. AVG fields are null when no rows match the FILTER predicate.","title":"ConversationStats"},"MessageRole":{"type":"string","enum":["user","assistant","system","tool","operator"],"description":"Who produced the turn: `user` is the caller, `assistant` the AI\nagent, `tool` a tool call, `system` a transcript annotation (such\nas the take-over window markers), and `operator` a human\noperator's speech while they have taken the call over.\n","title":"MessageRole"},"Message":{"type":"object","properties":{"id":{"type":"string"},"conversation_id":{"type":"string","description":"Prefixed wire identifier (`conv_<26 char Crockford base32>`)\nof the parent conversation.\n"},"role":{"$ref":"#/components/schemas/MessageRole","description":"Who produced the turn: `user` is the caller, `assistant` the AI\nagent, `tool` a tool call, `system` a transcript annotation (such\nas the take-over window markers), and `operator` a human\noperator's speech while they have taken the call over.\n"},"content":{"type":"string"},"tool_name":{"type":["string","null"]},"tool_args":{"type":["object","null"],"additionalProperties":{"description":"Any type"}},"tool_result":{"description":"Arbitrary JSON value returned by the tool (object, array, string, or primitive)."},"started_at":{"type":"string","format":"date-time"},"ended_at":{"type":["string","null"],"format":"date-time"}},"required":["id","conversation_id","role","content","started_at"],"title":"Message"},"ListMessagesResponse":{"type":"object","properties":{"next_cursor":{"type":["string","null"],"description":"Opaque keyset cursor for the next page. Pass back as the\n`cursor` request parameter. `null` when the caller has\nreached the end of the list (`has_more` is also `false`\nin that case).\n"},"has_more":{"type":"boolean","description":"True when more rows exist beyond this page."},"messages":{"type":"array","items":{"$ref":"#/components/schemas/Message"}}},"required":["next_cursor","has_more","messages"],"description":"Shared pagination metadata composed into every cursor-paginated\nlist response via `allOf`. Ships `has_more` alongside `next_cursor`\nas two equivalent end-of-pages signals (defense-in-depth).\n","title":"ListMessagesResponse"},"EvaluationKind":{"type":"string","enum":["criterion","summary","data"],"title":"EvaluationKind"},"EvaluationStatus":{"type":"string","enum":["success","failure","unknown"],"description":"Three-state criterion result. `unknown` means the criterion did not apply to this call.","title":"EvaluationStatus"},"Evaluation":{"type":"object","properties":{"id":{"type":"string"},"conversation_id":{"type":"string","description":"Prefixed wire identifier (`conv_<26 char Crockford base32>`)\nof the conversation this evaluation is attached to.\n"},"kind":{"$ref":"#/components/schemas/EvaluationKind"},"criterion_id":{"type":["string","null"]},"name":{"type":"string"},"status":{"oneOf":[{"$ref":"#/components/schemas/EvaluationStatus"},{"type":"null"}],"description":"Three-state criterion result. `unknown` means the criterion did not apply to this call."},"passed":{"type":["boolean","null"]},"score":{"type":["string","null"],"title":"float"},"rationale":{"type":"string"},"data":{"description":"Structured data-collection payload (present only on `kind=data` rows)."},"created_at":{"type":"string","format":"date-time"}},"required":["id","conversation_id","kind","name","rationale","created_at"],"description":"Three flavours coexist, discriminated by `kind`:\n- `criterion` rows carry `status` + `passed` + `score` + `rationale` for one criterion\n- `summary` row carries overall sentiment + rationale in `rationale`\n- `data` row carries the structured data-collection payload in `data`\n\n`status` is the canonical three-state result. `passed` is a\nderived boolean kept for backwards compatibility with earlier\nwebhook consumers: success\u2192true, failure\u2192false, unknown\u2192null.\n","title":"Evaluation"},"ListEvaluationsResponse":{"type":"object","properties":{"next_cursor":{"type":["string","null"],"description":"Opaque keyset cursor fo