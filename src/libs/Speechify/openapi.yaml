/tts:UpdateToolRequest"}}}}}},"/v1/conversations":{"get":{"operationId":"list","summary":"List","description":"List conversations owned by the caller, ordered by most recent.","tags":["subpackage_tts.subpackage_tts/conversations"],"parameters":[{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"A list of conversations.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:ListConversationsResponse"}}}}}}},"/v1/conversations/{id}":{"get":{"operationId":"get","summary":"Get","description":"Retrieve a conversation by ID.","tags":["subpackage_tts.subpackage_tts/conversations"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The requested conversation.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:Conversation"}}}}}}},"/v1/conversations/{id}/messages":{"get":{"operationId":"list-messages","summary":"List Messages","description":"Retrieve the full transcript for a conversation, in order.","tags":["subpackage_tts.subpackage_tts/conversations"],"parameters":[{"name":"id","in":"path","required":true,"schema":{"type":"string"}},{"name":"Authorization","in":"header","description":"Enter the key with the `Bearer` prefix, e.g. 'Bearer API_KEY|ACCESS_TOKEN'.","required":true,"schema":{"type":"string"}}],"responses":{"200":{"description":"The messages for the conversation.","content":{"application/json":{"schema":{"$ref":"#/components/schemas/tts:ListMessagesResponse"}}}}}}},"/v1/conversations/{id}/evaluations":{"get":{"operationId":"list-evaluations","summary":"List Evaluations","description":"Retrieve post-call evaluation results for