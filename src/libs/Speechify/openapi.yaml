ol params.","title":"ToolParamType"},"ToolParam":{"type":"object","properties":{"name":{"type":"string"},"type":{"$ref":"#/components/schemas/ToolParamType"},"description":{"type":"string"},"required":{"type":"boolean"},"enum":{"type":"array","items":{"type":"string"}}},"required":["name","type","description","required"],"description":"One argument the LLM can pass when calling the tool. Mirrors the JSON-Schema subset standard function-calling schemas support.","title":"ToolParam"},"BuiltinToolConfig":{"type":"object","properties":{"builtin":{"$ref":"#/components/schemas/SystemBuiltin"},"params":{"type":"array","items":{"$ref":"#/components/schemas/ToolParam"}},"builtin_config":{"type":"object","additionalProperties":{"description":"Any type"},"description":"Per-builtin extras (e.g. allowed_numbers for transfer_to_number)."}},"required":["builtin"],"description":"Config shape for `kind=builtin`. The `builtin` value names the\nworker-resident capability; the catalogue served by\n`GET /v1/agents/tool-capabilities` is the runtime source of truth\nfor valid names plus their human-readable labels. `builtin_config`\ncarries per-instance extras (e.g. allowed_numbers for\ntransfer_to_number, audio_asset_id for play_audio).\n","title":"BuiltinToolConfig"},"WebhookToolConfigMethod":{"type":"string","enum":["POST","GET"],"title":"WebhookToolConfigMethod"},"WebhookToolConfig":{"type":"object","properties":{"url":{"type":"string","format":"uri"},"method":{"$ref":"#/components/schemas/WebhookToolConfigMethod"},"headers":{"type":"object","additionalProperties":{"type":"string"},"description":"Static headers sent with every call. `Authorization` and `Speechify-Signature` are reserved."},"timeout_ms":{"type":"integer","description":"Per-call timeout in milliseconds. Defaults to 10000 server-side when omitted."},"params":{"type":"array","items":{"$ref":"#/components/schemas/ToolParam"}},"fire_and_forget":{"type":"boolean","description":"When true the worker dispatches the HTTP request and returns\nimmediately to the LLM with a synthetic \"queued\" result\ninstead of waiting for the response body. The customer's\nendpoint is expected to enqueue the work and return any\nnon-error status quickly; errors raised after dispatch are\nlogged but never surfaced to the LLM. Use for long-running\ncustomer-side work (job triggers, async ticket creation,\netc.) where blocking the call on the response would hurt\nthe conversation. Defaults to false.\n"}},"required":["url"],"description":"Config shape for `kind=webhook`.","title":"WebhookToolConfig"},"ClientToolConfig":{"type":"object","properties":{"params":{"type":"array","items":{"$ref":"#/components/schemas/ToolParam"}},"timeout_ms":{"type":"integer","description":"Per-call timeout in milliseconds. Defaults to 10000 server-side when omitted."}},"description":"Config shape for `kind=client`. Execution happens in the caller's browser / SDK.","title":"ClientToolConfig"},"MCPTransport":{"type":"string","enum":["http_streamable","sse"],"description":"MCP transport. `http_streamable` is the default; `sse` is the\nlegacy fallback for servers that haven't migrated yet.\n","title":"MCPTransport"},"MCPAuth":{"oneOf":[{"type":"object","properties":{"type":{"type":"string","enum":["none"],"description":"Discriminator value: none"}},"required":["type"],"description":"none variant"},{"type":"object","properties":{"type":{"type":"string","enum":["bearer"],"description":"Discriminator value: bearer"},"credential_id":{"type":"string","description":"`cred_<crockford>` id of a `bearer` credential in the workspace\nvault. Create the credential first via `POST /v1/credentials`,\nthen reference it here.\n"}},"required":["type","credential_id"],"description":"Bearer auth for an MCP server. References a workspace credential of\nkind `bearer` by id; the secret lives in the credentials vault and is\nresolved server-side at dispatch, never inlined on the tool.\n"},{"type":"object","properties":{"type":{"type":"string","enum":["oauth2_client_credentials"],"description":"Discriminator value: oauth2_client_credentials"},"credential_id":{"type":"string","description":"`cred_<crockford>` id of an `oauth2_client_credentials` credential\nin the workspace vault.\n"}},"required":["type","credential_id"],"description":"OAuth2 client-credentials auth for an MCP server. References a\nworkspace credential of kind `oauth2_client_credentials` by id; the\ntoken_url / client_id / client_secret / scopes all live in the vault\ncredential and are resolved server-side at dispatch.\n"}],"discriminator":{"propertyName":"type"},"description":"Discriminated union over `type`.","title":"MCPAuth"},"MCPToolConfig":{"type":"object","properties":{"endpoint":{"type":"string","format":"uri"},"transport":{"$ref":"#/components/schemas/MCPTransport"},"auth":{"$ref":"#/components/schemas/MCPAuth"}},"required":["endpoint","auth"],"description":"Config shape for `kind=mcp`. The worker opens the\nconfigured transport at session start, runs `initialize` +\n`list_tools`, and registers each discovered remote tool as a\nlivekit-agents function_tool proxying through the long-lived\nClientSession.\n","title":"MCPToolConfig"},"AgentToolConfig":{"oneOf":[{"$ref":"#/components/schemas/BuiltinToolConfig"},{"$ref":"#/components/schemas/WebhookToolConfig"},{"$ref":"#/components/schemas/ClientToolConfig"},{"$ref":"#/components/schemas/MCPToolConfig"}],"description":"Resolved config - `BuiltinToolConfig`, `WebhookToolConfig`, `ClientToolConfig`, or `MCPToolConfig` depending on `kind`.","title":"AgentToolConfig"},"AgentTool":{"type":"object","properties":{"id":{"type":"string","description":"Prefixed wire identifier (`tool_<26 char Crockford base32>`), stable across kinds."},"kind":{"$ref":"#/components/schemas/ToolKind"},"name":{"type":"string"},"description":{"type":"string"},"enabled":{"type":"boolean","description":"When false the tool is configured but skipped at dispatch."},"definition_id":{"type":["string","null"],"description":"Provenance: the backing workspace tool definition id for\nshared kinds (webhook/client/mcp), or `null` for a built-in.\nNon-null \u27fa the tool's config is shared and edited at\n`/v1/agents/tool-definitions/{tool_definition_id}`.\n"},"config":{"$ref":"#/components/schemas/AgentToolConfig","description":"Resolved config - `BuiltinToolConfig`, `WebhookToolConfig`, `ClientToolConfig`, or `MCPToolConfig` depending on `kind`."},"webhook_secret":{"type":"string","description":"HMAC signing secret for a `webhook` tool. Returned in full\n**only** on the create response; subsequent reads return a\nmasked placeholder.\n"},"created_at":{"type":"string","format":"date-time"},"updated_at":{"type":"string","format":"date-time"}},"required":["id","kind","name","description","enabled","definition_id","config","created_at","updated_at"],"description":"One thing an agent can do, in the unified per-agent view. Kind\ndiscriminates a per-agent built-in instance (`builtin`) from an\nattached workspace tool definition (`webhook`/`client`/`mcp`).\nThe config is resolved + embedded so consumers never have to fetch\nthe backing definition. `id` is a `tool_<...>` for every kind.\n","title":"AgentTool"},"ListAgentToolsResponse":{"type":"object","properties":{"next_cursor":{"type":["string","null"],"description":"Opaque keyset cursor for the next page. Pass back as the\n`cursor` request parameter. `null` when the caller has\nreached the end of the list (`has_more` is also `false`\nin that case).\n"},"has_more":{"type":"boolean","description":"True when more rows exist beyond this page."},"tools":{"type":"array","items":{"$ref":"#/components/schemas/AgentTool"}}},"required":["next_cursor","has_more","tools"],"description":"The agent's full, mixed-kind toolbelt, cursor-paginated.\n","title":"ListAgentToolsResponse"},"CreateAgentToolRequestConfig":{"oneOf":[{"$ref":"#/components/schemas/BuiltinToolConfig"},{"$ref":"#/components/schemas/WebhookToolConfig"},{"$ref":"#/components/schemas/ClientToolConfig"},{"$ref":"#/components/schemas/MCPToolConfig"}],"title":"CreateAgentToolRequestConfig"},"CreateAgentToolRequest":{"type":"object","properties":{"kind":{"$ref":"#/components/schemas/ToolKind"},"name":{"type":"string"},"description":{"type":"string"},"enabled":{"type":"boolean","description":"Defaults to true on the server when omitted."},"config":{"$ref":"#/components/schemas/CreateAgentToolRequestConfig"}},"required":["kind","name","config"],"description":"Add a tool to an agent. With `kind=builtin`, `config` carries a\n`BuiltinToolConfig` and a per-agent built-in instance is created.\nWith `kind=webhook`/`client`/`mcp`, `config` carries that kind's\nconfig and a workspace definition is created AND attached in one\ncall.\n","title":"CreateAgentToolRequest"},"UpdateAgentToolRequestConfig":{"oneOf":[{"$ref":"#/components/schemas/BuiltinToolConfig"}],"description":"For a built-in, the full `BuiltinToolConfig`. Rejected for shared kinds.","title":"UpdateAgentToolRequestConfig"},"UpdateAgentToolRequest":{"type":"object","properties":{"name":{"type":"string"},"description":{"type":"string"},"config":{"$ref":"#/components/schemas/UpdateAgentToolRequestConfig","description":"For a built-in, the full `BuiltinToolConfig`. Rejected for shared kinds."},"params":{"type":"array","items":{"$ref":"#/components/schemas/ToolParam"}},"enabled":{"type":"boolean"}},"description":"PATCH body. For a built-in, all fields apply. For an attached\nexternal tool only `enabled` is honoured - editing the shared\nconfig/name from here returns `tool_config_shared`.\n","title":"UpdateAgentToolRequest"},"ToolConfig":{"oneOf":[{"$ref":"#/components/schemas/WebhookToolConfig"},{"$ref":"#/components/schemas/ClientToolConfig"},{"$ref":"#/components/schemas/MCPToolConfig"}],"description":"One of `WebhookToolConfig`, `ClientToolConfig`, or `MCPToolConfig` depending on `kind`.","title":"ToolConfig"},"Tool":{"type":"object","properties":{"id":{"type":"string","description":"Prefixed wire identifier (`tool_<26 char Crockford base32>`).\n"},"name":{"type":"string"},"description":{"type":"string"},"kind":{"$ref":"#/components/schemas/ToolKind"},"config":{"$ref":"#/components/schemas/ToolConfig","description":"One of `WebhookToolConfig`, `ClientToolConfig`, or `MCPToolConfig` depending on `kind`."},"webhook_secret":{"type":"string","description":"HMAC signing secret for `kind=webhook`. Returned in full **only** on the create\nresponse; all subsequent reads return a masked placeholder. Store it on first\ncreate \u2014 there is no way to retrieve it later.\n"},"created_at":{"type":"string","format":"date-time"},"updated_at":{"type":"string","format":"date-time"}},"required":["id","name","description","kind","config","created_at","updated_at"],"description":"A workspace tool definition: a reusable webhook / client / MCP\nintegration created once and attached to many agents. Built-ins\nare NOT definitions - they are per-agent (see `AgentTool`).\n","title":"Tool"},"ListToolsResponse":{"type":"object","properties":{"next_cursor":{"type":["string","null"],"description":"Opaque keyset cursor for the next page. Pass back as the\n`cursor` request parameter. `null` when the caller has\nreached the end of the list (`has_more` is also `false`\nin that case).\n"},"has_more":{"type":"boolean","description":"True when more rows exist beyond this page."},"tools":{"type":"array","items":{"$ref":"#/components/schemas/Tool"}}},"required":["next_cursor","has_more","tools"],"description":"Payload for `GET /v1/agents/tool-definitions` \u2014 the workspace-level\ntool-definition catalog. Cursor-paginated; the per-agent toolbelt\nendpoint uses a different (bare, mixed-kind) shape \u2014 see\nListAgentToolsResponse.\n","title":"ListToolsResponse"},"CreateToolRequestConfig":{"oneOf":[{"$ref":"#/components/schemas/WebhookToolConfig"},{"$ref":"#/components/schemas/ClientToolConfig"},{"$ref":"#/components/schemas/MCPToolConfig"}],"title":"CreateToolRequestConfig"},"CreateToolRequest":{"type":"object","properties":{"name":{"type":"string"},"description":{"type":"string"},"kind":{"$ref":"#/components/schemas/ToolKind"},"config":{"$ref":"#/components/schemas/CreateToolRequestConfig"}},"required":["name","description","kind","config"],"description":"Create a workspace tool definition (webhook / client / mcp only).","title":"CreateToolRequest"},"UpdateToolRequestConfig":{"oneOf":[{"$ref":"#/components/schemas/WebhookToolConfig"},{"$ref":"#/components/schemas/ClientToolConfig"},{"$ref":"#/components/schemas/MCPToolConfig"}],"title":"UpdateToolRequestConfig"},"UpdateToolRequest":{"type":"object","properties":{"name":{"type":"string"},"description":{"type":"string"},"config":{"$ref":"#/components/schemas/UpdateToolRequestConfig"}},"description":"All fields optional. `kind` is immutable \u2014 create a new definition to change it.","title":"UpdateToolRequest"},"ToolAttachedAgent":{"type":"object","properties":{"id":{"type":"string","description":"Opaque agent ID."},"name":{"type":"string","description":"Human-readable agent name."}},"required":["id","name"],"description":"Minimal agent identity returned alongside a tool so a client\ncan render \"this tool is attached to: X, Y\" before a\ndestructive action runs.\n","title":"ToolAttachedAgent"},"ListToolAttachedAgentsResponse":{"type":"object","properties":{"next_cursor":{"type":["string","null"],"description":"Opaque keyset cursor for the next page. Pass back as the\n`cursor` request parameter. `null` when the caller has\nreached the end of the list (`has_more` is also `false`\nin that case).\n"},"has_more":{"type":"boolean","description":"True when more rows exist beyond this page."},"agents":{"type":"array","items":{"$ref":"#/components/schemas/ToolAttachedAgent"}}},"required":["next_cursor","has_more","agents"],"description":"Response shape for GET /v1/agents/tool-definitions/{tool_definition_id}/attached-agents.\nAgents are tenant-scoped and ordered by name ASC.\n","title":"ListToolAttachedAgentsResponse"},"TestMCPConnectionRequest":{"type":"object","properties":{"config":{"$ref":"#/components/schemas/MCPToolConfig"}},"required":["config"],"description":"Body for `POST /v1/agents/tool-definitions/test-mcp-connection`. `config` is the\nsame MCPToolConfig shape `POST /v1/agents/tool-definitions` would persist; nothing\nis persisted by the probe itself. For a non-none auth, the server\nresolves `auth.credential_id` to the vault secret before probing \u2014\nthe credential is created up front via `POST /v1/credentials`, so it\nresolves independently of any tool.\n","title":"TestMCPConnectionRequest"},"MCPProbeTool":{"type":"object","properties":{"name":{"type":"string"},"description":{"type":"string"}},"required":["name"],"description":"One discovered tool in a probe result.","title":"MCPProbeTool"},"McpProbeErrorDetailsStage":{"type":"string","enum":["validation","oauth2_token","mcp_connect","mcp_initialize","mcp_notify","mcp_list_tools"],"title":"McpProbeErrorDetailsStage"},"MCPProbeErrorDetails":{"type":"object","properties":{"stage":{"$ref":"#/components/schemas/McpProbeErrorDetailsStage"},"http_status":{"type":"integer"},"oauth2_error":{"type":"string"},"oauth2_error_description":{"type":"string"},"upstream_body":{"type":"string"},"field_hint":{"type":"string"}},"description":"Structured upstream signal for an MCP probe failure. All fields\nare optional; a client renders what's present. `stage` names\nthe phase the probe was in (`validation`, `oauth2_token`,\n`mcp_connect`, `mcp_initialize`, `mcp_notify`, `mcp_list_tools`).\n`oauth2_error` / `oauth2_error_description` mirror RFC 6749 \u00a75.2\nwhen the customer's auth server returned the standard error\nshape. `http_status` is the upstream status code for transport\nfailures. `upstream_body` is a truncated prefix (max ~1 KiB) of\nthe upstream response body when the failure isn't structured.\n`field_hint` names a form field (`endpoint`, `transport`,\n`token`, `token_url`, `client_id`, `client_secret`, `scope`)\na client should highlight so the customer knows what to fix.\n","title":"MCPProbeErrorDetails"},"MCPProbeResult":{"type":"object","properties":{"tools":{"type":["array","null"],"items":{"$ref":"#/components/schemas/MCPProbeTool"}},"error":{"type":"string"},"details":{"$ref":"#/components/schemas/MCPProbeErrorDetails"}},"required":["tools"],"description":"Result of an MCP probe. On success, `tools` is the discovered\ncatalogue and `error` is absent. On failure, `tools` is `null`\nand `error` carries a human-readable reason a client can render\ninline next to the form. `details` is optional structured\nsignal from the upstream (OAuth2 RFC 6749 fields, HTTP status,\ntruncated upstream body, form field hint) a client can use to\nexpand the inline banner and highlight the offending input.\nOlder clients ignore `details` and fall back to `error`. Both\nvalidation and network failures land in `error` rather than\nnon-2xx responses, so consumers must check `error` before\nreading `tools`.\n","title":"MCPProbeResult"},"TestWebhookConnectionRequest":{"type":"object","properties":{"config":{"$ref":"#/components/schemas/WebhookToolConfig"},"tool_id":{"type":"string","description":"Optional `tool_<crockford>` id of the existing tool to sign\nthe probe with. Raw UUIDs and other-resource prefixes are\nrejected.\n"}},"required":["config"],"description":"Body for `POST /v1/agents/tool-definitions/test-webhook-connection`.\n`config` is the same WebhookToolConfig shape `POST /v1/agents/tool-definitions`\nwould persist; nothing is persisted by the probe. `tool_id` is\nonly meaningful in the edit-form flow \u2014 when set, the server\nsigns the probe request with the tool's stored HMAC secret so\nthe test exercises the real signature path.\n","title":"TestWebhookConnectionRequest"},"WebhookProbeResult":{"type":"object","properties":{"ok":{"type":"boolean"},"status_code":{"type":"integer","description":"HTTP status the endpoint returned. Absent on a transport failure."},"latency_ms":{"type":"integer","format":"int64","description":"Wall-clock round-trip time in milliseconds."},"response_body":{"type":"string","description":"Truncated prefix (max ~2 KiB) of the endpoint's response body."},"signed":{"type":"boolean","description":"Whether the probe request carried an HMAC signature header."},"error":{"type":"string","description":"Human-readable transport-level failure reason. Absent when any response was received."}},"required":["ok","signed"],"description":"Result of a webhook probe. `ok` is true only when the endpoint\nreturned a 2xx. A non-2xx response still populates `status_code`\nand `response_body` with `ok=false` \u2014 the request reached the\nendpoint, the endpoint just declined it. `error` is set only for\ntransport-level failures (DNS, connect, TLS, timeout, blocked\naddress range) where no response was received; `status_code` is\nabsent in that case. `signed` reports whether the probe carried\na `Speechify-Signature` header \u2014 false on the create-form\nflow, which has no stored secret yet. Both success and failure\nuse the 200 envelope so a client can render them inline.\n","title":"WebhookProbeResult"},"SystemBuiltinInfo":{"type":"object","properties":{"name":{"$ref":"#/components/schemas/SystemBuiltin"},"label":{"type":"string","description":"Human-readable display label for the builtin."},"description":{"type":"string","description":"One-line summary of what the builtin does."}},"required":["name","label","description"],"description":"One entry in the system-builtin catalogue.","title":"SystemBuiltinInfo"},"ListSystemBuiltinsResponse":{"type":"object","properties":{"builtins":{"type":"array","items":{"$ref":"#/components/schemas/SystemBuiltinInfo"}}},"required":["builtins"],"title":"ListSystemBuiltinsResponse"},"TestType":{"type":"string","enum":["reply","tool","simulation"],"description":"Discriminates the shape of `AgentTest.config`.\n- `reply` - send one message to the agent and judge the response with an LLM.\n- `tool` - assert that the agent calls a specific tool given a context.\n- `simulation` - run a multi-turn conversation between the agent and an AI caller.\n","title":"TestType"},"SimulationMessageRole":{"type":"string","enum":["user","assistant"],"title":"SimulationMessageRole"},"SimulationMessage":{"type":"object","properties":{"role":{"$ref":"#/components/schemas/SimulationMessageRole"},"content":{"type":"string"}},"required":["role","content"],"description":"One turn in a simulation conversation. `role` is `user` (the AI caller) or `assistant` (the agent).","title":"SimulationMessage"},"ReplyConfig":{"type":"object","properties":{"context":{"type":"string","description":"User message sent to the agent to trigger the behaviour under test. Optional when `initial_chat_history` already ends with a user message."},"success_criteria":{"type":"string","description":"Natural-language description of what a passing agent response looks like."},"success_examples":{"type":"array","items":{"type":"string"},"description":"Concrete examples of passing responses (few-shot for the judge)."},"failure_examples":{"type":"array","items":{"type":"string"},"description":"Concrete examples of failing responses (few-shot for the judge)."},"initial_chat_history":{"type":"array","items":{"$ref":"#/components/schemas/SimulationMessage"},"description":"Optional seed conversation prepended before `context`. Lets you test the agent's reply mid-conversation rather than on a cold single-turn prompt."},"system_prompt_override":{"type":"string","description":"Deprecated. Prefer the run-level `config_override`\non `POST /v1/agents/{agent_id}/tests/runs`, which applies a proposed\nprompt to every test in the run without editing each one.\nStill honoured; the run-level override wins when both are set.\nReplaces the agent's system prompt for this run only."},"first_message_override":{"type":"string","description":"Replaces the agent's first message for this run only."},"model_override":{"type":"string","description":"Deprecated. Prefer the run-level `config_override`\non `POST /v1/agents/{agent_id}/tests/runs`. Still honoured; the\nrun-level override wins when both are set. Overrides the LLM\nmodel used by the agent for this run only."}},"required":["success_criteria"],"description":"Configuration for a `reply` test. The runner sends `context` as\na user message and asks an LLM judge to evaluate the agent response\nagainst `success_criteria`. Optional few-shot examples sharpen the\njudge's calibration. Use `initial_chat_history` to prepend prior\nturns before `context`; when the history already ends with a user\nmessage, `context` may be omitted and the agent is evaluated on\nits reply to that last history turn.","title":"ReplyConfig"},"ParameterCheckMode":{"type":"string","enum":["exact","regex","llm"],"description":"How a `ParameterCheck` validates a tool argument.\n- `exact` - JSON equality.\n- `regex` - the argument stringified is matched against the pattern.\n- `llm` - an LLM judge decides whether the value semantically satisfies\n  the criteria (e.g. \"is a plausible email address\").\n","title":"ParameterCheckMode"},"ParameterCheck":{"type":"object","properties":{"path":{"type":"string","description":"Dotted JSON path to the argument being checked. Empty means the whole args object."},"mode":{"$ref":"#/components/schemas/ParameterCheckMode"},"expected":{"type":"string","description":"Expected value string for `exact` and `regex` modes."},"criteria":{"type":"string","description":"Natural-language criteria for `llm` mode (e.g. \"is a valid email address\")."}},"required":["path","mode"],"description":"Validates one argument of an expected tool call. `path` is a\ndotted JSON path (e.g. `customer.email`); use zero-indexed\nnotation for arrays (`items.0.sku`). An empty path checks the\nwhole args object.","title":"ParameterCheck"},"ToolCallConfig":{"type":"object","properties":{"context":{"type":"string","description":"User message that should cause the agent to invoke the expected tool. Optional when `initial_chat_history` already ends with a user message."},"expected_tool":{"type":"string","description":"Name of the tool the agent is expected to call. Leave empty to\ninvert the assertion: the test passes only when the agent calls\nno tool at all."},"parameter_checks":{"type":"array","items":{"$ref":"#/components/schemas/ParameterCheck"},"description":"Assertions on specific arguments of the tool call."},"initial_chat_history":{"type":"array","items":{"$ref":"#/components/schemas/SimulationMessage"},"description":"Optional seed conversation prepended before `context`."},"system_prompt_override":{"type":"string","description":"Deprecated. Prefer the run-level `config_override`\non `POST /v1/agents/{agent_id}/tests/runs`. Still honoured; the\nrun-level override wins when both are set. Replaces the\nagent's system prompt for this run only."},"model_override":{"type":"string","description":"Deprecated. Prefer the run-level `config_override`\non `POST /v1/agents/{agent_id}/tests/runs`. Still honoured; the\nrun-level override wins when both are set. Overrides the LLM\nmodel used by the agent for this run only."}},"required":["expected_tool"],"description":"Configuration for a `tool` test. The runner sends `context` as a\nuser message and asserts that the agent calls `expected_tool` with\narguments matching all `parameter_checks`. Use\n`initial_chat_history` to test tool invocations that only make\nsense mid-conversation.","title":"ToolCallConfig"},"DataAssertionMode":{"type":"string","enum":["exact","regex","llm"],"description":"How the assertion validates the extracted value.","title":"DataAssertionMode"},"DataAssertion":{"type":"object","properties":{"key":{"type":"string","description":"Name of the data-collection field on the agent's evaluation config. The assertion fails when this key is missing from the extracted data."},"mode":{"$ref":"#/components/schemas/DataAssertionMode","description":"How the assertion validates the extracted value."},"expected":{"type":"string","description":"Expected value string for `exact` and `regex` modes."},"criteria":{"type":"string","description":"Natural-language criteria for `llm` mode."}},"required":["key","mode"],"description":"Asserts on one entry in the LLM-extracted data-collection map\nproduced by the unified evaluator. `key` matches a\ndata-collection field configured on the agent; the assertion\nruns against the value the judge wrote under that key. Same\nexact / regex / llm modes as `ParameterCheck` so the tool-call\nand data-collection assertion surfaces are uniform.","title":"DataAssertion"},"SimulationConfig":{"type":"object","properties":{"scenario":{"type":"string","description":"Instructions for the AI caller describing who they are and what they want."},"max_turns":{"type":"integer","default":5,"description":"Maximum agent turns before the simulation is cut off and judged."},"initial_chat_history":{"type":"array","items":{"$ref":"#/components/schemas/SimulationMessage"},"description":"Optional seed conversation that precedes the AI caller's first generated message."},"data_assertions":{"type":"array","items":{"$ref":"#/components/schemas/DataAssertion"},"description":"Optional assertions on the LLM-extracted data-collection\nmap. Each entry references a key from the agent's\ndata_collection config and validates the extracted value.\nThe test fails if any assertion fails."},"system_prompt_override":{"type":"string","description":"Deprecated. Prefer the run-level `config_override`\non `POST /v1/agents/{agent_id}/tests/runs`. Still honoured; the\nrun-level override wins when both are set. Replaces the\nagent's system prompt for this run only."},"model_override":{"type":"string","description":"Deprecated. Prefer the run-level `config_override`\non `POST /v1/agents/{agent_id}/tests/runs`. Still honoured; the\nrun-level override wins when both are set. Overrides the LLM\nmodel used by the agent for this run only."}},"required":["scenario"],"description":"Configuration for a `simulation` test. An AI caller drives a\nmulti-turn conversation with the agent according to `scenario`.\nAfter `max_turns` exchanges (or when the agent ends the call),\nthe unified post-call evaluator scores the synthetic transcript\nagainst the agent's configured evaluation criteria + data\ncollection fields. A test passes when no configured criterion\nfails and every `data_assertions` entry passes.","title":"SimulationConfig"},"AgentTestConfig":{"oneOf":[{"$ref":"#/components/schemas/ReplyConfig"},{"$ref":"#/components/schemas/ToolCallConfig"},{"$ref":"#/components/schemas/SimulationConfig"}],"description":"Type-specific configuration document.","title":"AgentTestConfig"},"MockingStrategy":{"type":"string","enum":["none","all","selected"],"description":"Controls which tool calls the runner intercepts during a run.\nSystem tools (`end_call`, `transfer_to_number`, etc.) are never\nmocked regardless of strategy.\n- `none` - no interception; all tools are called normally.\n- `all` - every non-system tool call is intercepted and matched\n  against the `mocks` list.\n- `selected` - only tools explicitly listed in `mocks` are\n  intercepted; others are called normally.\n","title":"MockingStrategy"},"ToolMock":{"type":"object","properties":{"tool_name":{"type":"string","description":"Name of the tool to intercept."},"args_match":{"type":"object","additionalProperties":{"description":"Any type"},"description":"Optional structured argument matcher. When set, the mock fires\nonly if the tool call's arguments deep-contain every key/value\nin this object: nested objects match recursively as subsets,\narrays and scalar leaves match by deep equality. An empty\nobject matches unconditionally. When absent the mock matches\nunconditionally for this tool."},"response":{"description":"JSON value returned to the agent as the tool result."}},"required":["tool_name","response"],"description":"A canned response returned when the agent calls `tool_name`. If\n`args_match` is set the mock only triggers when the call arguments\ndeep-contain it (a structured subset match). A mock without\n`args_match` always matches for its tool.","title":"ToolMock"},"NoMatchBehavior":{"type":"string","enum":["call_real_tool","finish_with_error","skip"],"description":"Fallback when a mockable tool is called but no configured mock\nmatches the call arguments.\n- `call_real_tool` - pass-through: actually invoke the underlying\n  tool (a webhook tool POSTs to the customer endpoint). Use only\n  when the real call is safe to make from a test.\n- `finish_with_error` - fail: the run finishes as a `failed`\n  verdict. Useful when a test wants to assert that a specific\n  mocked response path is taken - any unmocked tool call fails the\n  test.\n- `skip` - return an empty stub (`{\"skipped\":true}`) to the agent so\n  the simulation proceeds without treating the call as a failure.\n  Useful when a tool's output is irrelevant to the behaviour under\n  test but the model may still decide to call it. This is the\n  default for a test with no mock configuration.\n","title":"NoMatchBehavior"},"ToolMockConfig":{"type":"object","properties":{"strategy":{"$ref":"#/components/schemas/MockingStrategy"},"mocks":{"type":"array","items":{"$ref":"#/components/schemas/ToolMock"},"description":"Canned responses for specific tools (order matters - first match wins)."},"no_match_behavior":{"$ref":"#/components/schemas/NoMatchBehavior"}},"required":["strategy","no_match_behavior"],"description":"Controls tool-call interception during a test run.","title":"ToolMockConfig"},"TestVerdict":{"type":"string","enum":["passed","failed"],"description":"The domain pass/fail judgment of an agent-test run or suite run,\nseparate from the lifecycle `status`. Present only once the run\nreached a verdict (`status` is `completed`); absent for a run that\ncould not execute (`status` `failed`), was `cancelled`, or is still\nin flight.\n","title":"TestVerdict"},"ReplyResult":{"type":"object","properties":{"agent_response":{"type":"string","description":"The raw text response the agent produced."},"passed":{"type":"boolean"},"rationale":{"type":"string","description":"LLM judge's explanation of the verdict."},"score":{"type":"string","title":"float","description":"0-1 judge confidence score."},"duration_ms":{"type":"integer","format":"int64","description":"Wall-clock time for the run in milliseconds."}},"required":["agent_response","passed","rationale","score","duration_ms"],"description":"Result details for a `reply` test run.","title":"ReplyResult"},"ParameterCheckResult":{"type":"object","properties":{"path":{"type":"string"},"mode":{"$ref":"#/components/schemas/ParameterCheckMode"},"actual_json":{"type":"string","description":"JSON-serialised actual value at `path`."},"passed":{"type":"boolean"},"rationale":{"type":"string","description":"LLM rationale (populated for `llm` mode checks)."}},"required":["path","mode","actual_json","passed"],"description":"Result of one `ParameterCheck` within a tool-call test run.","title":"ParameterCheckResult"},"ToolCallResult":{"type":"object","properties":{"tool_called":{"type":"string","description":"Name of the tool the agent actually called (may differ from `expected_tool`)."},"tool_args":{"description":"Arguments the agent passed to the tool, as a JSON object."},"expected_tool":{"type":"string","description":"Name of the tool the test expected the agent to call."},"tool_matched":{"type":"boolean","description":"True when `tool_called` equals `expected_tool`."},"parameter_results":{"type":"array","items":{"$ref":"#/components/schemas/ParameterCheckResult"}},"passed":{"type":"boolean"},"rationale":{"type":"string","description":"Explanation of the overall verdict."},"duration_ms":{"type":"integer","format":"int64"}},"required":["tool_called","expected_tool","tool_matched","parameter_results","passed","rationale","duration_ms"],"description":"Result details for a `tool` test run.","title":"ToolCallResult"},"SimulationToolCall":{"type":"object","properties":{"turn_index":{"type":"integer","description":"Zero-based index of the conversation turn in which this call occurred."},"tool_name":{"type":"string"},"args":{"description":"Arguments passed to the tool, as a JSON object."},"response":{"description":"Response returned to the agent (absent for system tools that end the call)."},"mocked":{"type":"boolean"}},"required":["turn_index","tool_name","args","mocked"],"description":"One tool invocation that occurred during a simulation run.\n`mocked` is true when the call was intercepted by the run's\nmock config; false when the real tool was called or when the\ntool is a system tool.","title":"SimulationToolCall"},"SimulationResultSentiment":{"type":"string","enum":["positive","neutral","negative"],"description":"Overall sentiment classification.","title":"SimulationResultSentiment"},"SimulationCriterionResultStatus":{"type":"string","enum":["success","failure","unknown"],"description":"Three-state outcome. `unknown` means the criterion did not\napply on this run (the topic never came up); `failure`\nmeans it did apply and the agent did not satisfy it.","title":"SimulationCriterionResultStatus"},"SimulationCriterionResult":{"type":"object","properties":{"criterion_id":{"type":"string"},"name":{"type":"string"},"status":{"$ref":"#/components/schemas/SimulationCriterionResultStatus","description":"Three-state outcome. `unknown` means the criterion did not\napply on this run (the topic never came up); `failure`\nmeans it did apply and the agent did not satisfy it."},"score":{"type":"string","title":"float","description":"0.0..1.0 continuous estimate of how well the criterion was met."},"rationale":{"type":"string"}},"required":["criterion_id","name","status","rationale"],"description":"One scored entry of an agent's configured evaluation criterion\nagainst a simulation transcript. Mirrors the per-criterion row\nthe post-call evaluator persists, so test runs and live\nconversations carry identical per-criterion shapes.","title":"SimulationCriterionResult"},"DataAssertionResultMode":{"type":"string","enum":["exact","regex","llm"],"title":"DataAssertionResultMode"},"DataAssertionResult":{"type":"object","properties":{"key":{"type":"string"},"mode":{"$ref":"#/components/schemas/DataAssertionResultMode"},"actual_json":{"type":"string","description":"The extracted value rendered as JSON (`null` when the key was missing from the data map)."},"passed":{"type":"boolean"},"rationale":{"type":"string","description":"Empty on pass; reason for failure otherwise."}},"required":["key","mode","actual_json","passed"],"description":"Outcome of one `data_assertions` entry: did the value the\nevaluator extracted under `key` pass the configured exact /\nregex / llm check.","title":"DataAssertionResult"},"SimulationResult":{"type":"object","properties":{"transcript":{"type":"array","items":{"$ref":"#/components/schemas/SimulationMessage"},"description":"Full synthetic conversation in order."},"tool_calls":{"type":"array","items":{"$ref":"#/components/schemas/SimulationToolCall"},"description":"Every tool invocation across all turns."},"turns_used":{"type":"integer","description":"Number of agent turns that ran before the simulation ended."},"passed":{"type":"boolean"},"rationale":{"type":"string","description":"Top-level verdict explanation (run summary on pass; first failing criterion or assertion on fail)."},"duration_ms":{"type":"integer","format":"int64"},"summary":{"type":"string","description":"One-sentence narrative summary of what happened in the conversation."},"sentiment":{"$ref":"#/components/schemas/SimulationResultSentiment","description":"Overall sentiment classification."},"criteria":{"type":"array","items":{"$ref":"#/components/schemas/SimulationCriterionResult"},"description":"One result row per configured EvaluationCriterion on the\nagent. Same shape as the per-criterion rows persisted on\nthe post-call evaluations table."},"data":{"type":"object","additionalProperties":{"description":"Any type"},"description":"LLM-extracted values for the agent's configured\ndata-collection fields. Keys mirror the agent's\ndata_collection field keys; values are typed per the\ndeclared field type."},"data_assertions":{"type":"array","items":{"$ref":"#/components/schemas/DataAssertionResult"},"description":"One result row per `data_assertions` entry on the simulation config."}},"required":["transcript","turns_used","passed","rationale","duration_ms"],"description":"Result details for a `simulation` test run. Scoring is unified\nwith the post-call evaluator: the synthetic transcript\nis scored against the agent's configured evaluation criteria\nand data-collection fields, then per-test `data_assertions`\ncheck the extracted values. The top-level `passed` is derived\n\u2014 every criterion must resolve to `success` or `unknown` and\nevery assertion must pass.","title":"SimulationResult"},"TestRunResult":{"type":"object","properties":{"test_type":{"$ref":"#/components/schemas/TestType"},"passed":{"type":"boolean"},"rationale":{"type":"string","description":"Top-level verdict explanation duplicated from the inner result for quick rendering."},"duration_ms":{"type":"integer","format":"int64"},"reply":{"oneOf":[{"$ref":"#/components/schemas/ReplyResult"},{"type":"null"}]},"tool_call":{"oneOf":[{"$ref":"#/components/schemas/ToolCallResult"},{"type":"null"}]},"simulation":{"oneOf":[{"$ref":"#/components/schemas/SimulationResult"},{"type":"null"}]}},"required":["test_type","passed","rationale","duration_ms"],"description":"Union-like result of a completed test run. Exactly one of\n`reply`, `tool_call`, or `simulation` is populated, matching\nthe `test_type`.","title":"TestRunResult"},"AgentTestRun":{"type":"object","properties":{"id":{"type":"string","description":"Prefixed wire identifier (`run_<26 char Crockford base32>`).\nURL paths accept only this\nprefixed form; legacy UUID path parameters are rejected with\n404.\n"},"test_id":{"type":"string","description":"Prefixed wire identifier (`test_<26 char Crockford base32>`)\nof the parent test.\n"},"agent_id":{"type":"string","description":"Prefixed wire identifier (`agent_<26 char Crockford base32>`)\nof the agent this run executed against.\n"},"status":{"$ref":"#/components/schemas/JobStatus"},"verdict":{"oneOf":[{"$ref":"#/components/schemas/TestVerdict"},{"type":"null"}],"description":"The pass/fail judgment, present only once the run reached a\nverdict (`status` is `completed`).\n"},"started_at":{"type":["string","null"],"format":"date-time"},"ended_at":{"type":["string","null"],"format":"date-time"},"result":{"oneOf":[{"$ref":"#/components/schemas/TestRunResult"},{"type":"null"}],"description":"Populated once the run reached a verdict."},"error":{"type":"string","description":"Human-readable error message when `status` is `failed`."},"created_at":{"type":"string","format":"date-time"}},"required":["id","test_id","agent_id","status","created_at"],"description":"One execution of a test. The lifecycle `status` is the unified\nasync-job vocabulary; the pass/fail judgment lives in the separate\n`verdict` field. `result` is populated when the run reached a\nverdict (`status` is `completed`); see `TestRunResult` for the\nshape. A run that could not execute is `status` `failed` with no\n`verdict`, and `error` carries the reason.","title":"AgentTestRun"},"AgentTestWithLastRun":{"type":"object","properties":{"id":{"type":"string","description":"Prefixed wire identifier (`test_<26 char Crockford base32>`).\nURL paths accept only this\nprefixed form; legacy UUID path parameters are rejected with\n404.\n"},"agent_id":{"type":"string","description":"Prefixed wire identifier (`agent_<26 char Crockford base32>`)\nof the owning agent.\n"},"name":{"type":"string"},"description":{"type":"string"},"type":{"$ref":"#/components/schemas/TestType"},"config":{"$ref":"#/components/schemas/AgentTestConfig","description":"Type-specific configuration document."},"tool_mock_config":{"$ref":"#/components/schemas/ToolMockConfig","description":"Optional tool-mocking config applied during runs of this test."},"variables":{"type":"object","additionalProperties":{"description":"Any type"},"description":"Per-test dynamic-variable overrides. Keys substitute `{{key}}`\nplaceholders inside the test config at run-start. Unknown keys\nrender as empty string, matching session dispatch behaviour.\n"},"folder_id":{"type":["string","null"],"description":"When set, prefixed wire identifier\n(`folder_<26 char Crockford base32>`) of the containing folder.\nNull means root (unfiled).\n"},"created_at":{"type":"string","format":"date-time"},"updated_at":{"type":"string","format":"date-time"},"last_run":{"oneOf":[{"$ref":"#/components/schemas/AgentTestRun"},{"type":"null"}],"description":"The most recent run, or null if the test has never been run."}},"required":["id","agent_id","name","description","type","config","created_at","updated_at"],"description":"List-view projection of a test that includes the most recent run\nso a client can display pass/fail badges without an extra\nround-trip.","title":"AgentTestWithLastRun"},"ListTestsResponse":{"type":"object","properties":{"next_cursor":{"type":["string","null"],"description":"Opaque keyset cursor for the next page. Pass back as the\n`cursor` request parameter. `null` when the caller has\nreached the end of the list (`has_more` is also `false`\nin that case).\n"},"has_more":{"type":"boolean","description":"True when more rows exist beyond this page."},"tests":{"type":"array","items":{"$ref":"#/components/schemas/AgentTestWithLastRun"}}},"required":["next_cursor","has_more","tests"],"description":"Workspace-wide paginated list of tests. Walk pages while\n`has_more` is true; pass `next_cursor` back as the request\n`cursor` parameter.","title":"ListTestsResponse"},"AgentTest":{"type":"object","properties":{"id":{"type":"string","description":"Prefixed wire identifier (`test_<26 char Crockford base32>`).\nURL paths accept only this\nprefixed form; legacy UUID path parameters are rejected with\n404.\n"},"agent_id":{"type":"string","description":"Prefixed wire identifier (`agent_<26 char Crockford base32>`)\nof the owning agent.\n"},"name":{"type":"string"},"description":{"type":"string"},"type":{"$ref":"#/components/schemas/TestType"},"config":{"$ref":"#/components/schemas/AgentTestConfig","description":"Type-specific configuration document."},"tool_mock_config":{"$ref":"#/components/schemas/ToolMockConfig","description":"Optional tool-mocking config applied during runs of this test."},"variables":{"type":"object","additionalProperties":{"description":"Any type"},"description":"Per-test dynamic-variable overrides. Keys substitute `{{key}}`\nplaceholders inside the test config at run-start. Unknown keys\nrender as empty string, matching session dispatch behaviour.\n"},"folder_id":{"type":["string","null"],"description":"When set, prefixed wire identifier\n(`folder_<26 char Crockford base32>`) of the containing folder.\nNull means root (unfiled).\n"},"created_at":{"type":"string","format":"date-time"},"updated_at":{"type":"string","format":"date-time"}},"required":["id","agent_id","name","description","type","config","created_at","updated_at"],"description":"A configured test against a voice agent. `config` is a\ntype-specific document - see `ReplyConfig`, `ToolCallConfig`,\nand `SimulationConfig` for the per-type shapes (discriminated by `type`).","title":"AgentTest"},"UpdateAgentTestRequestConfig":{"oneOf":[{"$ref":"#/components/schemas/ReplyConfig"},{"$ref":"#/components/schemas/ToolCallConfig"},{"$ref":"#/components/schemas/SimulationConfig"}],"description":"Replaces the test config when present.","title":"UpdateAgentTestRequestConfig"},"UpdateAgentTestRequest":{"type":"object","properties":{"name":{"type":"string"},"description":{"type":"string"},"config":{"$ref":"#/components/schemas/UpdateAgentTestRequestConfig","description":"Replaces the test config when present."},"tool_mock_