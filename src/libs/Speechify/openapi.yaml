 `has_more` alongside `next_cursor`\nas two equivalent end-of-pages signals (defense-in-depth).\n","title":"ListAgentTestFoldersResponse"},"CreateAgentTestFolderRequest":{"type":"object","properties":{"name":{"type":"string"},"parent_folder_id":{"type":["string","null"],"description":"Prefixed wire identifier (`folder_<26 char Crockford base32>`)\nof the parent folder. Omit / null for a root-level folder.\n"}},"required":["name"],"title":"CreateAgentTestFolderRequest"},"UpdateAgentTestFolderRequest":{"type":"object","properties":{"name":{"type":"string"},"parent_folder_id":{"type":["string","null"],"description":"Prefixed wire identifier (`folder_<26 char Crockford base32>`)\nof the folder to reparent this folder under, or `null` to\nreparent it to root. Omit to leave unchanged.\n"}},"description":"PATCH body (JSON merge-patch). All fields optional; omit a field\nto leave it unchanged. Set `parent_folder_id` to a target folder\nid to reparent into that folder, or send `parent_folder_id: null`\nto reparent this folder to root.","title":"UpdateAgentTestFolderRequest"},"ListAgentTestRunsResponse":{"type":"object","properties":{"next_cursor":{"type":["string","null"],"description":"Opaque keyset cursor for the next page. Pass back as the\n`cursor` request parameter. `null` when the caller has\nreached the end of the list (`has_more` is also `false`\nin that case).\n"},"has_more":{"type":"boolean","description":"True when more rows exist beyond this page."},"runs":{"type":"array","items":{"$ref":"#/components/schemas/AgentTestRun"}}},"required":["next_cursor","has_more","runs"],"description":"Shared pagination metadata composed into every cursor-paginated\nlist response via `allOf`. Ships `has_more` alongside `next_cursor`\nas two equivalent end-of-pages signals (defense-in-depth).\n","title":"ListAgentTestRunsResponse"},"BatchRunEntry":{"type":"object","properties":{"test_id":{"type":"string","description":"Prefixed wire identifier (`test_<26 char Crockford base32>`)\nof the test to run.\n"},"agent_id":{"type":"string","description":"Prefixed wire identifier (`agent_<26 char Crockford base32>`)\nof the agent to run the test against. Omit to run against the\ntest's owner agent.\n"}},"required":["test_id"],"description":"One entry in a batch-run request. Omit `agent_id` to run the test\nagainst its owner agent.","title":"BatchRunEntry"},"RunBatchRequest":{"type":"object","properties":{"entries":{"type":"array","items":{"$ref":"#/components/schemas/BatchRunEntry"}}},"required":["entries"],"description":"Batch-run payload. Total expanded runs across all entries are\ncapped at 100 per call.","title":"RunBatchRequest"},"SuiteRunTrigger":{"type":"string","enum":["run_all","batch","resubmit"],"description":"Which entry point created a suite run.\n- `run_all`  - POST /v1/agents/{agent_id}/tests/runs.\n- `batch`    - POST /v1/agents/tests/runs/batch.\n- `resubmit` - POST /v1/agents/tests/suite-runs/{suite_run_id}/resubmit.\n","title":"SuiteRunTrigger"},"AgentTestSuiteRunResults":{"type":"object","properties":{"passed":{"type":"integer"},"failed":{"type":"integer"}},"required":["passed","failed"],"description":"Per-verdict breakdown among the `completed` child runs.","title":"AgentTestSuiteRunResults"},"TestRunConfigOverride":{"type":"object","properties":{"prompt":{"type":"string","description":"Replaces the agent's system prompt for every test in the run."},"model":{"type":"string","description":"Overrides the LLM model for every test in the run. The model\nid rides on the agent's configured provider \u2014 a\ncross-provider switch is not supported."},"tool_ids":{"type":"array","items":{"type":"string"},"description":"Replaces the agent's attached external tools for the run with\nexactly this set. Each entry is a prefixed `tool_<crockford>`\nid; `builtin_` ids are rejected. An empty array runs with no\ntools; omit the field to keep the agent's attachments."}},"description":"A run-level config override applied to every test in a Run All.\nLayered on top of the agent's stored config for the duration of\nthe suite run, so the whole suite can be validated against a\nproposed prompt / model / toolbelt without editing any test. An\nabsent field leaves the agent's value untouched; a run-level\noverride wins over a deprecated per-test `system_prompt_override`\n/ `model_override`.","title":"TestRunConfigOverride"},"AgentTestSuiteRun":{"type":"object","properties":{"id":{"type":"string","description":"Prefixed wire identifier (`srun_<26 char Crockford base32>`)."},"agent_id":{"type":["string","null"],"description":"Prefixed `agent_<crockford>` id of the agent whose suite\nwas run. Set for the `run_all` trigger; null for `batch`,\nwhich can span many agents.\n"},"agent_name":{"type":["string","null"],"description":"Display name of `agent_id`'s agent, resolved at read time.\nNull whenever `agent_id` is null, and on the suite run\nembedded in run/resubmit creation responses.\n"},"trigger":{"$ref":"#/components/schemas/SuiteRunTrigger"},"parent_suite_run_id":{"type":["string","null"],"description":"Set on a `resubmit`: the prefixed `srun_<crockford>` id of\nthe suite run whose failed/errored tests this one re-ran.\nNull for `run_all` and `batch`.\n"},"status":{"$ref":"#/components/schemas/JobStatus"},"verdict":{"oneOf":[{"$ref":"#/components/schemas/TestVerdict"},{"type":"null"}],"description":"The suite's pass/fail judgment, present only when `status` is\n`completed`.\n"},"total":{"type":"integer","description":"Number of child runs in the suite."},"completed":{"type":"integer","description":"Child runs that produced a verdict."},"failed":{"type":"integer","description":"Child runs that could not execute (an infrastructure failure)."},"running":{"type":"integer","description":"Child runs actively executing."},"pending":{"type":"integer","description":"Child runs queued, not yet executing."},"cancelled":{"type":"integer","description":"Child runs cancelled."},"results":{"$ref":"#/components/schemas/AgentTestSuiteRunResults","description":"Per-verdict breakdown among the `completed` child runs."},"created_at":{"type":"string","format":"date-time"},"ended_at":{"type":["string","null"],"format":"date-time","description":"Newest child-run completion; null until every child run is terminal."},"config_override":{"oneOf":[{"$ref":"#/components/schemas/TestRunConfigOverride"},{"type":"null"}],"description":"The run-level config override this suite was run\nwith, or null for an ordinary Run All / batch."},"flow_version_id":{"type":["string","null"],"description":"The flow version (`agent_versions` row) this suite targeted\n(prefixed external id, `fver_...`), or null for the agent's\nactive / synthesized flow."},"flow_version_number":{"type":["integer","null"],"description":"Human-facing version number of `flow_version_id`; null when no version was targeted."}},"required":["id","trigger","status","total","completed","failed","running","pending","cancelled","results","created_at"],"description":"A suite run (test invocation): the grouping object over every\ntest run dispatched by one Run All, batch, or resubmit call.\n`status`, `verdict`, and the count fields are derived from the\nchild runs. `status` is the unified async-job lifecycle: `running`\nwhile any child is pending/running, then `cancelled` (any child\ncancelled), `failed` (any child could not execute), or `completed`\n(every child produced a verdict). When `completed`, `verdict` is\n`passed` if every child passed, else `failed`. `results` carries\nthe per-verdict breakdown.","title":"AgentTestSuiteRun"},"RunAgentTestsResponse":{"type":"object","properties":{"runs":{"type":"array","items":{"$ref":"#/components/schemas/AgentTestRun"}},"suite_run":{"oneOf":[{"$ref":"#/components/schemas/AgentTestSuiteRun"},{"type":"null"}],"description":"The suite run grouping the queued runs."}},"required":["runs"],"description":"Response from `POST /v1/agents/{agent_id}/tests/runs` and the suite-run\nresubmit endpoint. Contains every newly-queued run so the client\ncan poll each for completion, plus the `suite_run` that groups\nthem. `suite_run` is null only when a Run All found no tests.","title":"RunAgentTestsResponse"},"ListSuiteRunsResponse":{"type":"object","properties":{"next_cursor":{"type":["string","null"],"description":"Opaque keyset cursor for the next page. Pass back as the\n`cursor` request parameter. `null` when the caller has\nreached the end of the list (`has_more` is also `false`\nin that case).\n"},"has_more":{"type":"boolean","description":"True when more rows exist beyond this page."},"suite_runs":{"type":"array","items":{"$ref":"#/components/schemas/AgentTestSuiteRun"}}},"required":["next_cursor","has_more","suite_runs"],"description":"One page of suite runs, newest first. Walk pages while\n`has_more` is true; pass `next_cursor` back as the request\n`cursor` parameter.","title":"ListSuiteRunsResponse"},"AgentTestSuiteRunWithRunsResults":{"type":"object","properties":{"passed":{"type":"integer"},"failed":{"type":"integer"}},"required":["passed","failed"],"description":"Per-verdict breakdown among the `completed` child runs.","title":"AgentTestSuiteRunWithRunsResults"},"SuiteChildRun":{"type":"object","properties":{"id":{"type":"string","description":"Prefixed wire identifier (`run_<26 char Crockford base32>`).\nURL paths accept only this\nprefixed form; legacy UUID path parameters are rejected with\n404.\n"},"test_id":{"type":"string","description":"Prefixed wire identifier (`test_<26 char Crockford base32>`)\nof the parent test.\n"},"agent_id":{"type":"string","description":"Prefixed wire identifier (`agent_<26 char Crockford base32>`)\nof the agent this run executed against.\n"},"status":{"$ref":"#/components/schemas/JobStatus"},"verdict":{"oneOf":[{"$ref":"#/components/schemas/TestVerdict"},{"type":"null"}],"description":"The pass/fail judgment, present only once the run reached a\nverdict (`status` is `completed`).\n"},"started_at":{"type":["string","null"],"format":"date-time"},"ended_at":{"type":["string","null"],"format":"date-time"},"result":{"oneOf":[{"$ref":"#/components/schemas/TestRunResult"},{"type":"null"}],"description":"Populated once the run reached a verdict."},"error":{"type":"string","description":"Human-readable error message when `status` is `failed`."},"created_at":{"type":"string","format":"date-time"},"test_name":{"type":"string","description":"Name of the test this run executed."},"agent_name":{"type":"string","description":"Display name of the agent this run executed against."}},"required":["id","test_id","agent_id","status","created_at","test_name","agent_name"],"description":"One child run inside a suite run, carrying the parent test's\nname and the target agent's name so the grouped result view can\nlabel each row. The agent name disambiguates results when the\nsuite spans multiple agents.","title":"SuiteChildRun"},"AgentTestSuiteRunWithRuns":{"type":"object","properties":{"id":{"type":"string","description":"Prefixed wire identifier (`srun_<26 char Crockford base32>`)."},"agent_id":{"type":["string","null"],"description":"Prefixed `agent_<crockford>` id of the agent whose suite\nwas run. Set for the `run_all` trigger; null for `batch`,\nwhich can span many agents.\n"},"agent_name":{"type":["string","null"],"description":"Display name of `agent_id`'s agent, resolved at read time.\nNull whenever `agent_id` is null, and on the suite run\nembedded in run/resubmit creation responses.\n"},"trigger":{"$ref":"#/components/schemas/SuiteRunTrigger"},"parent_suite_run_id":{"type":["string","null"],"description":"Set on a `resubmit`: the prefixed `srun_<crockford>` id of\nthe suite run whose failed/errored tests this one re-ran.\nNull for `run_all` and `batch`.\n"},"status":{"$ref":"#/components/schemas/JobStatus"},"verdict":{"oneOf":[{"$ref":"#/components/schemas/TestVerdict"},{"type":"null"}],"description":"The suite's pass/fail judgment, present only when `status` is\n`completed`.\n"},"total":{"type":"integer","description":"Number of child runs in the suite."},"completed":{"type":"integer","description":"Child runs that produced a verdict."},"failed":{"type":"integer","description":"Child runs that could not execute (an infrastructure failure)."},"running":{"type":"integer","description":"Child runs actively executing."},"pending":{"type":"integer","description":"Child runs queued, not yet executing."},"cancelled":{"type":"integer","description":"Child runs cancelled."},"results":{"$ref":"#/components/schemas/AgentTestSuiteRunWithRunsResults","description":"Per-verdict breakdown among the `completed` child runs."},"created_at":{"type":"string","format":"date-time"},"ended_at":{"type":["string","null"],"format":"date-time","description":"Newest child-run completion; null until every child run is terminal."},"config_override":{"oneOf":[{"$ref":"#/components/schemas/TestRunConfigOverride"},{"type":"null"}],"description":"The run-level config override this suite was run\nwith, or null for an ordinary Run All / batch."},"flow_version_id":{"type":["string","null"],"description":"The flow version (`agent_versions` row) this suite targeted\n(prefixed external id, `fver_...`), or null for the agent's\nactive / synthesized flow."},"flow_version_number":{"type":["integer","null"],"description":"Human-facing version number of `flow_version_id`; null when no version was targeted."},"runs":{"type":"array","items":{"$ref":"#/components/schemas/SuiteChildRun"}}},"required":["id","trigger","status","total","completed","failed","running","pending","cancelled","results","created_at","runs"],"description":"A suite run plus every child run, for the grouped detail view.","title":"AgentTestSuiteRunWithRuns"},"CreateAgentTestRequestConfig":{"oneOf":[{"$ref":"#/components/schemas/ReplyConfig"},{"$ref":"#/components/schemas/ToolCallConfig"},{"$ref":"#/components/schemas/SimulationConfig"}],"description":"Type-specific configuration. Must match the shape for the given `type`.","title":"CreateAgentTestRequestConfig"},"CreateAgentTestRequest":{"type":"object","properties":{"name":{"type":"string","description":"Short human-readable label for the test."},"description":{"type":"string","description":"Optional longer description of what this test verifies."},"type":{"$ref":"#/components/schemas/TestType"},"config":{"$ref":"#/components/schemas/CreateAgentTestRequestConfig","description":"Type-specific configuration. Must match the shape for the given `type`."},"tool_mock_config":{"$ref":"#/components/schemas/ToolMockConfig","description":"Optional tool-mocking config applied during every run of this test."},"variables":{"type":"object","additionalProperties":{"description":"Any type"},"description":"Per-test variable values substituted into string fields of the\nconfig at run-start. Keys use the same rules as agent-level\n`DynamicVariable` keys.\n"},"folder_id":{"type":["string","null"],"description":"Prefixed wire identifier (`folder_<26 char Crockford base32>`)\nof the folder to place the test in. Omit / null for root.\n"}},"required":["name","type","config"],"description":"Payload for `POST /v1/agents/{agent_id}/tests`.","title":"CreateAgentTestRequest"},"RunAllTestsRequest":{"type":"object","properties":{"config_override":{"$ref":"#/components/schemas/TestRunConfigOverride"},"flow_version_id":{"type":"string","description":"Targets a specific flow version (an `agent_versions` row)\ninstead of the agent's active flow \u2014 version-targeted\nregression. Must be a flow version of the agent under test.\nPrefixed external id (`fver_...`)."}},"description":"Optional body of `POST /v1/agents/{agent_id}/tests/runs`. Omit it\nentirely to run every test against the agent's live config and\nactive flow.","title":"RunAllTestsRequest"},"TestStatsBucket":{"type":"object","properties":{"day":{"type":"string","description":"ISO date (YYYY-MM-DD)."},"passed":{"type":"integer"},"failed":{"type":"integer"},"errored":{"type":"integer"}},"required":["day","passed","failed","errored"],"description":"One daily point on the aggregate pass-rate chart.","title":"TestStatsBucket"},"TestStats":{"type":"object","properties":{"window_days":{"type":"integer"},"buckets":{"type":"array","items":{"$ref":"#/components/schemas/TestStatsBucket"}},"total_runs":{"type":"integer"},"passed_runs":{"type":"integer"},"failed_runs":{"type":"integer"},"errored_runs":{"type":"integer"},"avg_duration_ms":{"type":"integer"},"by_type":{"type":"object","additionalProperties":{"type":"integer"}}},"required":["window_days","buckets","total_runs","passed_runs","failed_runs","errored_runs","avg_duration_ms"],"description":"Aggregate run metrics over the requested window. `buckets` is\ndense - one entry per day in the window, zero-filled, so a chart\nnever has gaps. `by_type` counts runs per test type across the\nwhole window.","title":"TestStats"},"PhoneNumberProvider":{"type":"string","enum":["livekit","twilio","telnyx","byoc","twilio_purchased","telnyx_purchased","verified_caller_id"],"description":"Which provider the number came from. Determines the provisioning\nand portability path.\n\n- `livekit` - LiveKit owns the carrier relationship; US inbound only.\n- `twilio` - Customer's own Twilio number bridged via Elastic SIP Trunk.\n- `telnyx` - Customer's own Telnyx number bridged via a Telnyx FQDN connection.\n- `byoc` - Any SIP provider using a customer-supplied trunk.\n- `twilio_purchased` - Bought through `POST /v1/agents/phone-numbers/purchase` on Speechify's master Twilio account; billed to Speechify.\n- `telnyx_purchased` - Bought through `POST /v1/agents/phone-numbers/purchase` (with `provider=telnyx`) on Speechify's master Telnyx account; billed to Speechify.\n- `verified_caller_id` - Customer-verified outbound caller ID on\n  their own Twilio account (Twilio's OutgoingCallerIds resource).\n  Server-determined at import time: when an `e164` submitted with\n  `provider=twilio` is not a full DID on the customer's account but\n  IS a verified caller ID, the resulting row gets this provider.\n  Outbound-only, never agent-bindable, rides the customer's\n  existing shared Twilio trunk for outbound routing. Requires a\n  prior `twilio` full-DID import from the same account; without\n  it the import returns 400.\n","title":"PhoneNumberProvider"},"PhoneNumberCapability":{"type":"string","enum":["inbound","outbound"],"description":"What the number can do. LiveKit-native numbers are `inbound` only;\nverified caller IDs are `outbound` only; Twilio and BYOC full-DID\nnumbers (and Speechify-purchased numbers) support both directions.\n","title":"PhoneNumberCapability"},"PhoneNumber":{"type":"object","properties":{"id":{"type":"string","description":"Prefixed wire identifier (`phone_<26 char Crockford base32>`).\nURL paths accept only this\nprefixed form; legacy UUID path parameters are rejected with\n404.\n"},"e164":{"type":"string","description":"The phone number in E.164 format (e.g. `+12025551234`)."},"type":{"$ref":"#/components/schemas/PhoneNumberProvider"},"label":{"type":"string","description":"Optional human-readable label set by the customer."},"trunk_id":{"type":"string","description":"ID of the SIP trunk backing this number, if applicable."},"agent_id":{"type":"string","description":"ID of the agent that answers calls to this number. Null when unbound."},"capabilities":{"type":"array","items":{"$ref":"#/components/schemas/PhoneNumberCapability"},"description":"What this number can do."},"created_at":{"type":"string","format":"date-time","description":"When the number was imported."},"updated_at":{"type":"string","format":"date-time","description":"When the number was last modified."}},"required":["id","e164","type","capabilities","created_at","updated_at"],"description":"A phone number in the workspace inventory. Bound to an agent via\n`agent_id`; unbound numbers are valid but non-functional until\nassigned.\n","title":"PhoneNumber"},"ListPhoneNumbersResponse":{"type":"object","properties":{"next_cursor":{"type":["string","null"],"description":"Opaque keyset cursor for the next page. Pass back as the\n`cursor` request parameter. `null` when the caller has\nreached the end of the list (`has_more` is also `false`\nin that case).\n"},"has_more":{"type":"boolean","description":"True when more rows exist beyond this page."},"numbers":{"type":"array","items":{"$ref":"#/components/schemas/PhoneNumber"},"description":"Phone numbers in the workspace."}},"required":["next_cursor","has_more","numbers"],"description":"Response for `GET /v1/agents/phone-numbers`.","title":"ListPhoneNumbersResponse"},"TwilioImportSpec":{"type":"object","properties":{"account_sid":{"type":"string","description":"Twilio Account SID (starts with `AC`)."},"auth_token":{"type":"string","description":"Twilio Auth Token. Write-only - never echoed back."}},"required":["account_sid","auth_token"],"description":"Twilio credentials for the one-click import flow. Used only when\n`provider=twilio`. The Account SID and Auth Token are used to\nprovision an Elastic SIP Trunk on the customer's Twilio account\npointing at LiveKit's SIP endpoint, then stored for future trunk\nmanagement operations.\n","title":"TwilioImportSpec"},"TelnyxImportSpec":{"type":"object","properties":{"connection_id":{"type":"string","description":"The Telnyx FQDN connection id (numeric string) the number is\nrouted through. Required.\n"},"sip_username":{"type":"string","description":"Optional credential-auth username for the Telnyx connection.\nWhen both `sip_username` and `sip_password` are provided, the\nimport also provisions outbound calling for the number; omit them\nfor an inbound-only import. Write-only - never echoed back.\n"},"sip_password":{"type":"string","description":"Optional credential-auth password for the Telnyx connection,\npaired with `sip_username`. Write-only - never echoed back.\n"}},"required":["connection_id"],"description":"Telnyx connection details for the bring-your-own-connection import\nflow. Used only when `provider=telnyx`. You provision an FQDN\nconnection on your Telnyx account whose inbound calls forward to\nSpeechify's LiveKit SIP ingress, assign the number to it, then import\nby passing the connection's id. A second number on the same connection\nreuses the one shared trunk + dispatch rule.\n","title":"TelnyxImportSpec"},"ImportPhoneNumberRequest":{"type":"object","properties":{"e164":{"type":"string","description":"The phone number in E.164 format. For `provider=livekit` this\nis the number you want LiveKit to purchase. For `provider=twilio`,\n`provider=telnyx`, and `provider=byoc` it is the number you\nalready own.\n"},"provider":{"$ref":"#/components/schemas/PhoneNumberProvider"},"label":{"type":"string","description":"Optional human-readable label."},"trunk_id":{"type":"string","description":"For `provider=byoc`: the SIP trunk to bind this number to.\nPrefixed wire identifier (`trunk_<26 char Crockford base32>`).\nNot required for `provider=livekit`, `provider=twilio`, or\n`provider=telnyx`.\n"},"agent_id":{"type":"string","description":"Optional agent to bind on import. Prefixed wire identifier\n(`agent_<26 char Crockford base32>`).\n"},"twilio":{"$ref":"#/components/schemas/TwilioImportSpec"},"telnyx":{"$ref":"#/components/schemas/TelnyxImportSpec"}},"required":["e164","provider"],"description":"Body for `POST /v1/agents/phone-numbers`. The required fields vary by\n`provider` - see the individual provider descriptions.\n","title":"ImportPhoneNumberRequest"},"PurchasedPhoneNumberProvider":{"type":"string","enum":["twilio_purchased","telnyx_purchased"],"description":"The carrier a Speechify-managed number is bought on, used by\n`POST /v1/agents/phone-numbers/purchase`. Restricted to the\npurchasable providers - the resulting `phone_numbers` row carries\nthe matching `PhoneNumberProvider` value.\n","title":"PurchasedPhoneNumberProvider"},"AvailablePhoneNumber":{"type":"object","properties":{"e164":{"type":"string","description":"The phone number in E.164 format."},"friendly_name":{"type":"string","description":"Carrier-formatted display variant, e.g. \"(415) 555-2671\"."},"locality":{"type":"string","description":"City the number is associated with, when known."},"region":{"type":"string","description":"Two-letter state code for US numbers."},"iso_country":{"type":"string","description":"ISO-3166 alpha-2 country code."},"provider":{"$ref":"#/components/schemas/PurchasedPhoneNumberProvider","description":"The purchasable carrier this number comes from. Pass it back\nverbatim as `provider` on the purchase request so the buy is\nplaced on the matching Speechify-managed account.\n"}},"required":["e164","iso_country","provider"],"description":"One hit from `GET /v1/agents/phone-numbers/available`. The number is\nnot held: a concurrent buy by another customer may take it\nbetween this response and a subsequent purchase request.\n","title":"AvailablePhoneNumber"},"SearchAvailablePhoneNumbersResponse":{"type":"object","properties":{"numbers":{"type":"array","items":{"$ref":"#/components/schemas/AvailablePhoneNumber"},"description":"Available numbers (may be empty if no inventory matches)."}},"required":["numbers"],"description":"Response for `GET /v1/agents/phone-numbers/available`.","title":"SearchAvailablePhoneNumbersResponse"},"PurchasePhoneNumberRequest":{"type":"object","properties":{"e164":{"type":"string","description":"The E.164 number to buy. Must currently be in carrier inventory."},"label":{"type":"string","description":"Optional human-readable label."},"provider":{"$ref":"#/components/schemas/PurchasedPhoneNumberProvider","description":"Which carrier's Speechify-managed account to buy on. Optional;\ndefaults to `twilio_purchased`.\n"},"agent_id":{"type":"string","description":"Optional agent to bind the number to at purchase time.\nPrefixed wire identifier (`agent_<26 char Crockford base32>`).\n"}},"required":["e164"],"description":"Body for `POST /v1/agents/phone-numbers/purchase`. The `e164` must come\nfrom a recent `SearchAvailablePhoneNumbers` response.\n","title":"PurchasePhoneNumberRequest"},"UpdatePhoneNumberRequest":{"type":"object","properties":{"label":{"type":"string","description":"New label. Pass an empty string to clear."}},"description":"PATCH body for `PATCH /v1/agents/phone-numbers/{phone_number_id}`. Edits the\nnumber's own attributes only - today just `label`. The number's\nprovider and `e164` are immutable after import. The agent binding is managed\nseparately as a relationship, via\n`POST`/`DELETE /v1/agents/{agent_id}/phone-numbers/{phone_number_id}`.\n","title":"UpdatePhoneNumberRequest"},"CreateOutboundCallRequest":{"type":"object","properties":{"agent_id":{"type":"string","description":"ID of the agent that handles the answered call."},"to":{"type":"string","description":"Destination phone number in E.164 format (e.g. `+12025559876`)."},"caller_id_number":{"type":"string","description":"The number shown to the callee as caller ID, in E.164 format.\nDefaults to the first outbound-capable number in the workspace.\nUseful for multi-number campaigns where you want to rotate\ncaller IDs.\n"},"dtmf_prefix":{"type":"string","description":"DTMF digits dialed automatically after the call is answered,\nbefore the agent begins speaking. Use this for IVR navigation\n(e.g. `1ww2` presses 1, waits two seconds, presses 2). `w`\nis a half-second pause; `W` is a one-second pause.\n"},"dynamic_variables":{"type":"object","additionalProperties":{"description":"Any type"},"description":"Per-call variable overrides merged on top of the agent's stored\ndefaults. Keys must not use the reserved `system__` prefix.\nUseful for injecting per-call context (customer name, order ID)\ninto the agent prompt.\n"},"ringing_timeout_ms":{"type":"integer","description":"How long to wait for the callee to answer before abandoning,\nin milliseconds. Defaults to 30000 (30s). Capped at 80000 (80s).\n"},"amd":{"$ref":"#/components/schemas/AMDConfig","description":"Optional per-call override for the AMD routing config. When\nset, wholesale-replaces the agent's stored AMD shape for\nthis single call (PATCH-replace, not merge). Unlocks the\nbatch-campaign pattern: one agent dialling many recipients\nwith per-row tailored voicemail messages via the existing\ndynamic_variables substitution. Validation rules match\nthe agent-update boundary.\n"}},"required":["agent_id","to"],"description":"Body for `POST /v1/agents/outbound-calls`. Requires a Twilio or BYOC\ntrunk; LiveKit-native numbers do not support outbound today.\n","title":"CreateOutboundCallRequest"},"CreateOutboundCallResponse":{"type":"object","properties":{"conversation_id":{"type":"string","description":"ID of the conversation created for this call. Use to poll status."}},"required":["conversation_id"],"description":"Returned synchronously when LiveKit accepts the SIP INVITE. Poll\n`GET /v1/agents/conversations/{conversation_id}` for status transitions:\n`pending` (ringing) \u2192 `active` (answered) \u2192 `completed`.\n","title":"CreateOutboundCallResponse"},"BatchCall":{"type":"object","properties":{"id":{"type":"string","description":"Prefixed wire identifier (`batch_<26 char Crockford base32>`).\nURL paths accept only this\nprefixed form; legacy UUID path parameters are rejected with\n404.\n"},"agent_id":{"type":"string","description":"Prefixed wire identifier (`agent_<26 char Crockford base32>`)\nof the agent that will run the batch.\n"},"phone_number_id":{"type":["string","null"],"description":"Caller-ID override. When set, prefixed wire identifier\n(`phone_<26 char Crockford base32>`) of the phone number to\nuse; falls back to the agent's bound number when null.\n"},"name":{"type":"string","description":"Human-readable batch name."},"status":{"$ref":"#/components/schemas/JobStatus","description":"Lifecycle status. A batch deferred to a future time is\n`pending` with a non-null `scheduled_at`; it moves to `running`\nonce the scheduled time arrives and the dispatcher starts\ndialing.\n"},"total":{"type":"integer","description":"